name: MOMIN privacy and account-deletion QA

on:
  pull_request:
    branches:
      - noor-ul-islam-live
    paths:
      - "privacy.html"
      - "delete-account.html"
      - "momin-public-account-deletion-v1.js"
      - "login.html"
      - "momin-profile-settings-v1.js"
      - "scripts/test-privacy-deletion-pages.mjs"
      - ".github/workflows/privacy-deletion-qa.yml"

permissions:
  contents: read

jobs:
  legal-deletion-static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate policy and deletion request flow
        run: node scripts/test-privacy-deletion-pages.mjs
      - name: Check deletion flow JavaScript syntax
        run: node --check momin-public-account-deletion-v1.js
