name: MOMIN Responsive and Browser QA

on:
  push:
    branches:
      - responsive-layout
      - feature/momin-admin-panel
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-qa:
    name: Static and Chromium responsive QA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project and browser-test dependencies
        run: npm install --no-audit --no-fund
      - name: Run static responsive and source checks
        run: npm run qa:responsive
      - name: Run Admin Panel static and security checks
        run: npm run qa:admin
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run authenticated and responsive browser tests
        run: npm run qa:e2e
      - name: Upload browser-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momin-playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
