name: MOMIN Responsive QA

on:
  push:
    branches:
      - responsive-layout
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-qa:
    name: Static responsive and source QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run responsive and asset QA
        run: npm run qa:responsive
