name: MOMIN Tablet Responsive QA

on:
  pull_request:
    branches:
      - noor-ul-islam-live
    paths:
      - "momin-tablet-responsive-v1.css"
      - "momin-device-responsive-v1.css"
      - "momin-shared-shell-v1.js"
      - "momin-prayer-page-v1.js"
      - "momin-home-design-v2.js"
      - "noor-v5.js"
      - "scripts/test-prayer-location-sync.mjs"
      - "scripts/test-sunrise-display.mjs"
      - "momin-journey-page-v1.js"
      - "momin-mosque-page-v1.js"
      - "momin-duas-page-v2.js"
      - "momin-inspiration-page-v1.js"
      - "momin-notifications-bridge-v1.js"
      - "momin-notifications-admin-inbox-v1.js"
      - "momin-giving-complaints-v1.js"
      - "supabase/migrations/20261102152955_momin_giving_user_read_access.sql"
      - "scripts/test-giving-sync.mjs"
      - "journey-page-v1.html"
      - "mosques-page-v1.html"
      - "duas-page-v2.html"
      - "duas-page-v1.html"
      - "inspiration-page-v1.html"
      - "islamic-calendar-reference.html"
      - "notifications.html"
      - "index.html"
      - "login.html"
      - "founder.html"
      - "prayers-page-v1.html"
      - "package.json"
      - "scripts/test-tablet-responsive.mjs"
      - ".github/workflows/tablet-responsive-qa.yml"
  push:
    branches:
      - tablet-responsive
    paths:
      - "momin-tablet-responsive-v1.css"
      - "index.html"
      - "login.html"
      - "founder.html"
      - "prayers-page-v1.html"
      - "package.json"
      - "scripts/test-tablet-responsive.mjs"
      - ".github/workflows/tablet-responsive-qa.yml"

permissions:
  contents: read

jobs:
  tablet-responsive:
    name: Verify responsive tablet layout
    runs-on: ubuntu-latest
    steps:
      - name: Check out MOMIN
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tablet responsive QA
        run: npm run test:tablet
      - name: Run Sunrise display regression QA
        run: npm run test:sunrise
      - name: Run prayer event sequence QA
        run: npm run test:prayer-sequence
      - name: Run current-location prayer timing QA
        run: npm run test:prayer-location
      - name: Run Admin-to-User Giving integration QA
        run: npm run test:giving
