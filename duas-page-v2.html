<!doctype html>
<html lang="en" data-theme="dark">
<head>
<!--
MOMIN DUAS — REDESIGNED SECTION (single standalone file)

INTEGRATION NOTES
1. Data: edit only the DATA block in the script (HILLS, C, DAILY, ITEMS). Replace those arrays with calls to your
   native Dua engine. Each item = {id, t:title, s:reference, c:[collection ids]}. Nothing else needs to change.
2. Parent bridge (unchanged contract): window.parent.MominDuasBridgeV1.openDua(id) and .navigate(route).
   NEW: .navigate("home") is also called when Back is pressed on the first Duas screen (leaves the section).
   Routes used: "home", "quran", "tasbeeh".
3. Storage keys (unchanged): duas-saved, duas-seen. RECENT_BASE keeps the original "views already recorded" offset.
4. Hash routes (unchanged): #home #collections #saved #recent #daily #c-<collectionId>.
5. Height: posts {type:"momin-duas-height-v1", height} to the parent as before.
6. Theme: fixed dark charcoal and gold. The parent light/dark sync was removed on purpose.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a07">
<meta name="color-scheme" content="dark">
<title>MOMIN — Duas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
:root{--bg:#0c0a07;--card:#17140f;--card2:#1f1a12;--line:#2e2819;--ink:#f4ecd8;--muted:#a39a85;--gold:#d4a63f;--gold2:#e8c071;--soft:rgba(212,166,63,.13);--glass:rgba(14,11,8,.88);--shadow:rgba(0,0,0,.6);
--serif:"Playfair Display",Georgia,"Times New Roman",serif;--sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ease:cubic-bezier(.22,1,.36,1);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-padding-top:90px}
body{margin:0;background:radial-gradient(80% 34% at 100% 0%,rgba(212,166,63,.11),transparent 70%),var(--bg);color:var(--ink);font:400 15px/1.45 var(--sans);padding:0 max(16px,env(safe-area-inset-right,0px)) 136px max(16px,env(safe-area-inset-left,0px));-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px;border-radius:12px}
svg{display:block}.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:480px;margin:0 auto}

/* top bar: back (left), compact title (centre), saved (right) */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-inline:-16px;padding:10px 16px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid transparent;transition:border-color .3s}
.bar.sc{border-bottom-color:var(--line)}
.back{justify-self:start;display:inline-flex;align-items:center;gap:2px;height:44px;max-width:100%;padding:0 16px 0 8px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:600;font-size:14.5px;transition:transform .25s var(--ease),border-color .25s,background .25s}
.back .i{color:var(--gold2);transition:transform .3s var(--ease)}
.back:hover{border-color:var(--gold);background:var(--soft)}.back:hover .i{transform:translateX(-3px)}.back:active{transform:scale(.95)}
.back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:112px}
.btitle{margin:0;max-width:38vw;font:600 17px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .35s var(--ease)}
.bar.tt .btitle{opacity:1;transform:none}
.act{position:relative;justify-self:end;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold2);transition:transform .25s var(--ease),border-color .25s}
.act:hover{border-color:var(--gold)}.act:active{transform:scale(.9)}
.act .cnt{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--gold);color:#1a1204;font-size:11px;font-weight:700;display:grid;place-items:center}
.act .cnt[hidden]{display:none}

/* view transitions */
#view{animation:vin .55s var(--ease) both}
#view.bwd{--dx:-26px}
@keyframes vin{from{opacity:0;transform:translateX(var(--dx,26px))}}
.rise{animation:rise .65s var(--ease) both;animation-delay:calc(var(--d,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.ph{padding:20px 2px 2px}
.ph h1{margin:0;font:600 clamp(32px,9vw,38px)/1.08 var(--serif);letter-spacing:-.015em}
.ph p{margin:8px 0 0;color:var(--muted)}

/* search */
.search{margin-top:18px;display:flex;align-items:center;gap:10px;height:56px;padding:0 8px 0 18px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);transition:border-color .25s,box-shadow .25s}
.search:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px var(--soft)}
.search .i{color:var(--muted)}
.search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:16px}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.search .x{width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--gold2);display:grid;place-items:center;transform:scale(0);transition:transform .3s var(--ease)}
.search.has .x{transform:scale(1)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.q{display:flex;flex-direction:column;align-items:flex-start;gap:14px;min-width:0;padding:16px;text-align:left;border-radius:22px;background:var(--card);border:1px solid var(--line);transition:transform .35s var(--ease),border-color .25s}
.q:hover{transform:translateY(-3px);border-color:var(--gold)}.q:active{transform:scale(.96)}
.q .qi{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--soft);color:var(--gold2)}
.q div{min-width:0;width:100%}.q span span{display:inline}.q b{display:block;font-weight:600;font-size:15.5px}
.q span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:36px 2px 14px}
.sh small{display:block;margin-bottom:6px;color:var(--gold);font-weight:700;letter-spacing:.16em;font-size:11px;text-transform:uppercase}
.sh h2{margin:0;font:600 26px/1.1 var(--serif);letter-spacing:-.01em}
.sh a{display:inline-flex;gap:6px;color:var(--gold);font-weight:600;font-size:14.5px;white-space:nowrap;transition:gap .3s var(--ease)}.sh a:hover{gap:10px}

/* scenes: warm dusk skies, no green, fixed icon size */
.scene{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--s1),var(--s2))}
.scene .sun{position:absolute;right:10%;top:8%;width:50%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,226,160,.5),transparent 68%);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.15);opacity:.7}}
.scene .st{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff3d0;animation:tw 3.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
.scene .hills{position:absolute;left:0;bottom:0;width:100%;height:58%}
.hills .h1{fill:rgba(10,8,5,.5)}.hills .h2{fill:rgba(10,8,5,.74)}
.scene .ico{position:absolute;z-index:2;right:17%;top:20%;width:clamp(34px,26%,52px);height:auto;aspect-ratio:1;color:#fff3d6;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 4px 12px rgba(255,214,130,.55));animation:bob 7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}

.hero{display:block;overflow:hidden;border-radius:28px;background:var(--card);border:1px solid var(--line);box-shadow:0 26px 44px -30px var(--shadow);transition:transform .4s var(--ease),border-color .25s}
.hero:hover{transform:translateY(-4px);border-color:var(--gold)}.hero:active{transform:scale(.985)}
.hero .scene{aspect-ratio:2.2}
.hero .hb2{display:flex;flex-direction:column;gap:8px;padding:18px 20px 20px}
.tag{align-self:flex-start;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--gold);font-size:10.5px;letter-spacing:.15em;font-weight:700;text-transform:uppercase}
.hero h3{margin:0;font:600 25px/1.1 var(--serif)}
.hero p{margin:0;color:var(--muted);font-size:14px}
.hero .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;color:var(--muted);font-size:13px}
.hero .ft .go{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--gold2);transition:transform .3s var(--ease)}
.hero:hover .go{transform:translateX(5px)}

.ccard{display:flex;flex-direction:column;min-width:0;overflow:hidden;border-radius:24px;background:var(--card);border:1px solid var(--line);transition:transform .4s var(--ease),border-color .25s,box-shadow .4s}
.ccard:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 22px 34px -24px var(--shadow)}.ccard:active{transform:scale(.97)}
.ccard .scene{aspect-ratio:1.45}
.ccard .cb{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px}
.ccard b{font-size:16.5px;font-weight:600;line-height:1.2}
.cn{align-self:flex-start;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--gold2);font-size:12.5px;font-weight:600}
.cn.soon{background:rgba(255,255,255,.06);color:var(--muted)}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;margin-inline:-16px;padding:4px 16px 16px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .ccard{flex:none;width:min(62vw,236px);scroll-snap-align:start}
.railwrap{position:relative}.railwrap::after{content:"";position:absolute;right:-16px;top:0;bottom:16px;width:36px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--bg))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.note{margin-top:24px;padding:16px 18px;border-radius:20px;border:1px solid var(--line);color:var(--muted);font-size:13.5px}

/* collection + lists */
.banner{position:relative;margin-top:16px;overflow:hidden;border-radius:28px;border:1px solid var(--line)}
.banner .scene{height:176px}
.banner .bt{position:absolute;z-index:3;inset:auto 0 0;padding:48px 20px 18px;background:linear-gradient(0deg,rgba(8,6,3,.9),transparent);color:#f7f0df}
.banner h1{margin:0;font:600 28px/1.1 var(--serif)}.banner p{margin:6px 0 0;font-size:14px;color:#d8cfb8}
.lblrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 2px 0;color:var(--muted);font-size:13.5px}
.lblrow button{color:var(--gold);font-weight:600;font-size:13.5px;padding:8px 4px}
.list{margin-top:12px;overflow:hidden;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.item{position:relative;display:flex;align-items:center;gap:14px;min-height:76px;padding:14px 12px 14px 16px;border-top:1px solid var(--line);cursor:pointer;transition:background .25s;animation:rise .55s var(--ease) both;animation-delay:calc(var(--d,0)*50ms)}
.item:first-child{border-top:0}.item:hover{background:var(--card2)}
.item .ib{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--soft);color:var(--gold2);font:600 15px var(--serif);font-variant-numeric:tabular-nums}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:16px;font-weight:600;line-height:1.3}
.item .tx span{display:block;margin-top:3px;color:var(--gold);font-size:13px;line-height:1.35}
.item .bm{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:transform .3s var(--ease),background .25s,color .25s}
.item .bm:hover{background:var(--soft);color:var(--gold2)}.item .bm:active{transform:scale(.82)}
.item .bm[aria-pressed="true"]{color:var(--gold2)}.item .bm[aria-pressed="true"] svg{fill:currentColor}
.item .bm.pop{animation:pop .45s var(--ease)}@keyframes pop{40%{transform:scale(1.28)}}
.item .go{flex:none;width:28px;color:var(--muted);transition:transform .3s var(--ease),color .25s}.item:hover .go{transform:translateX(3px);color:var(--gold)}
@media(max-width:360px){.item .go{display:none}}
mark{background:var(--soft);color:var(--gold2);border-radius:4px;padding:0 2px}
.empty{margin-top:18px;padding:36px 24px;border-radius:26px;border:1px dashed var(--line);text-align:center;color:var(--muted)}
.empty .eico{width:56px;height:56px;margin:0 auto 14px;border-radius:18px;display:grid;place-items:center;background:var(--soft);color:var(--gold2)}
.empty b{display:block;margin-bottom:6px;color:var(--ink);font:600 21px var(--serif)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.chip{padding:9px 16px;min-height:40px;border-radius:99px;border:1px solid var(--line);color:var(--gold2);font-weight:600;font-size:14px;transition:border-color .25s,background .25s}.chip:hover{border-color:var(--gold);background:var(--soft)}

/* tab bar + toast */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.tabs nav{pointer-events:auto;position:relative;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:26px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 22px 40px -18px var(--shadow)}
.ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:20px;background:var(--soft);border:1px solid var(--gold);transition:transform .5s var(--ease)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 9px;font-size:12px;font-weight:600;color:var(--muted);transition:color .3s}
.tab[aria-current="page"]{color:var(--gold2)}.tab .i{transition:transform .4s var(--ease)}.tab[aria-current="page"] .i{transform:translateY(-2px) scale(1.08)}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 40px);padding:12px 18px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;opacity:0;transform:translate(-50%,20px);pointer-events:none;transition:opacity .3s,transform .4s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#7a5410;font-weight:700;padding:6px 2px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* Embedded mode: MOMIN shared shell owns the only global header and bottom navigation. */
body.momin-duas-embedded{padding:0 16px calc(126px + env(safe-area-inset-bottom,0px));background:transparent;min-height:0}
body.momin-duas-embedded::before{display:none!important}
body.momin-duas-embedded .bar,body.momin-duas-embedded .tabs{display:none!important}
body.momin-duas-embedded .app{width:100%;max-width:480px;margin:0 auto}
body.momin-duas-embedded .ph{padding-top:9px}
body.momin-duas-embedded .toast{bottom:18px}
.view-back{display:inline-flex;align-items:center;gap:9px;min-height:42px;margin:5px 0 11px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.035);color:var(--gold2);font-size:13px;font-weight:600;transition:background .2s,border-color .2s,transform .2s}
.view-back .i{width:17px;height:17px}
.view-back:active{transform:scale(.97)}

</style>
</head>
<body>

  function key(){var h=(location.hash||"").slice(1);if(!h)return"home";if(h==="home"||h==="collections"||h==="saved"||h==="recent"||h==="daily")return h;if(h.indexOf("c-")===0&&CM[h.slice(2)])return h;return"home"}

    current=type==="list"?h:type;
    if(type==="home"){html=homeHTML();title="Duas"}

    if(type!=="home"){
      var previousRoute=stack.length>1?stack[stack.length-2]:"home";
      var previousLabel=previousRoute==="home"?"Duas home":previousRoute==="collections"?"All collections":(CM[previousRoute.slice(2)]?CM[previousRoute.slice(2)].n:"Back");
      html='<button class="view-back" type="button" data-view-back="'+esc(previousRoute)+'"><svg class="i" aria-hidden="true"><use href="#ic-back"/></svg><span>'+esc(previousLabel)+'</span></button>'+html;
    }
    if(type==="home")bindSearch();
    pulseCounts();onScroll();notifyParentHeight();
  }
  window.addEventListener("hashchange",route);
  function goBack(){
    if(stack.length>1){history.back();return}
    var h=key();
    if(h!=="home"){location.hash=h.indexOf("c-")===0?"collections":"home";return}
    var b=bridge();
    if(b&&b.navigate){b.navigate("home");return}
    toast("This is the first Duas screen");
  }
  $("back").onclick=goBack;
  $("act").onclick=function(){location.hash="saved"};
  document.addEventListener("keydown",function(e){
    if(e.key!=="Escape")return;
    var q=$("q");if(q&&q.value){$("qx").click();return}
    goBack();
  });

  /* actions */
  view.addEventListener("click",function(e){
    var back=e.target.closest("[data-view-back]");if(back){location.hash=back.dataset.viewBack;return}
    var st=e.target.closest("[data-st]");if(st){e.stopPropagation();toggle(st.dataset.st,st);return}
    var it=e.target.closest(".item");if(it){open(it.dataset.id);return}
    var g=e.target.closest("[data-go]");if(g){location.hash=g.dataset.go;return}
    var pr=e.target.closest("[data-parent-route]");if(pr){go(pr.dataset.parentRoute);return}
    var cl=e.target.closest("[data-clear]");if(cl){clearList(cl.dataset.clear);return}
    var sq=e.target.closest("[data-q]");if(sq){var q=$("q");q.value=sq.dataset.q;q.dispatchEvent(new Event("input"));q.focus()}
  });
  view.addEventListener("keydown",function(e){
    if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("item")){e.preventDefault();open(e.target.dataset.id)}
  });
  function go(r){
    var b=bridge();
    if(b&&b.navigate){b.navigate(r);return}
    toast("This section is not available right now");
  }
  function open(id){
    if(seen.indexOf(id)<0){seen.push(id);persist()}
    var b=bridge();
    if(b&&b.openDua){b.openDua(id);return}
    toast("Opening “"+BY[id].t+"”");
  }
  function toggle(id,btn){
    var k=saved.indexOf(id),was=k>-1;
    if(was)saved.splice(k,1);else saved.push(id);
    persist();updateAct();
    if(current==="saved"){view.innerHTML=savedHTML();toast("Removed from saved",{label:"Undo",fn:function(){saved.splice(Math.min(k,saved.length),0,id);persist();updateAct();view.innerHTML=savedHTML()}});return}
    var on=!was;
    [].forEach.call(document.querySelectorAll('[data-st="'+id+'"]'),function(b){b.setAttribute("aria-pressed",on);b.setAttribute("aria-label",(on?"Remove from saved: ":"Save: ")+BY[id].t);b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop")});
    toast(on?"Saved":"Removed from saved",on?null:{label:"Undo",fn:function(){saved.push(id);persist();updateAct();[].forEach.call(document.querySelectorAll('[data-st="'+id+'"]'),function(b){b.setAttribute("aria-pressed","true")})}});
  }
  function clearList(w){
    var prev=(w==="saved"?saved:seen).slice();
    if(w==="saved")saved=[];else seen=[];
    persist();updateAct();view.innerHTML=w==="saved"?savedHTML():recentHTML();
    toast(w==="saved"?"All saved duas removed":"Recents cleared",{label:"Undo",fn:function(){if(w==="saved")saved=prev;else seen=prev;persist();updateAct();view.innerHTML=w==="saved"?savedHTML():recentHTML()}});
  }
  function updateAct(){var c=$("actCnt");c.hidden=!saved.length;c.textContent=saved.length}
  updateAct();

  /* search */
  function bindSearch(){
    var q=$("q"),box=$("searchBox"),body=$("homeBody"),res=$("results");
    q.addEventListener("input",function(){
      var raw=q.value.trim(),v=raw.toLowerCase();
      box.classList.toggle("has",!!q.value);
      if(!v){body.hidden=false;res.hidden=true;return}
      var hits=ITEMS.filter(function(x){var cn=x.c.map(function(i){return i==="daily"?DAILY.n:(CM[i]?CM[i].n:"")}).join(" ");return (x.t+" "+x.s+" "+cn).toLowerCase().indexOf(v)>-1});
      var cols=C.filter(function(c){return c.n.toLowerCase().indexOf(v)>-1});
      var html="",total=hits.length+cols.length;
      if(total)html+='<p class="lblrow" aria-live="polite"><span>'+total+(total===1?" result":" results")+' for “'+esc(raw)+'”</span></p>';
      if(cols.length)html+='<div class="sh" style="margin-top:20px"><div><h2 style="font-size:21px">Collections</h2></div></div><div class="grid">'+cols.map(function(c,i){return colCard(c,i)}).join("")+'</div>';
      if(hits.length)html+='<div class="sh" style="margin-top:24px"><div><h2 style="font-size:21px">Duas</h2></div></div>'+listHTML(hits,false,raw);
      if(!html)html=emptyHTML("search","No matches","Try a word like sleep, mosque or forgiveness.",'<div class="chips"><button class="chip" type="button" data-q="sleep">sleep</button><button class="chip" type="button" data-q="mosque">mosque</button><button class="chip" type="button" data-q="forgiveness">forgiveness</button></div>');
      body.hidden=true;res.hidden=false;res.innerHTML=html;
    });
    q.addEventListener("keydown",function(e){if(e.key==="Enter")q.blur()});
    $("qx").onclick=function(){q.value="";q.dispatchEvent(new Event("input"));q.focus()};
  }
  function pulseCounts(){
    ["cBm","cRc"].forEach(function(id){
      var el=$(id);if(!el)return;var to=+el.dataset.count,t0=null;
      function step(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/800);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)}
      el.textContent=0;requestAnimationFrame(step);
    });
  }

  /* bar state: border after scroll, compact title once the page title has scrolled away */
  function onScroll(){
    var bar=$("bar"),pt=$("ptitle");
    bar.classList.toggle("sc",window.scrollY>6);
    bar.classList.toggle("tt",!!pt&&pt.getBoundingClientRect().bottom<64);
  }
  window.addEventListener("scroll",onScroll,{passive:true});

  /* tabs */
  var tabs=document.querySelectorAll(".tab"),ind=$("ind");
  function setTab(i){
    tabs.forEach(function(t,k){if(k===i)t.setAttribute("aria-current","page");else t.removeAttribute("aria-current")});
    ind.style.transform="translateX("+(i*100)+"%)";
  }
  tabs.forEach(function(t){t.addEventListener("click",function(){
    var i=+t.dataset.i;
    if(i===2){if(key()==="home")window.scrollTo({top:0,behavior:"smooth"});else location.hash="home";return}
    if(i===4){location.hash="saved";return}
    var b=bridge();
    if(b&&b.navigate){b.navigate(t.dataset.route);return}
    setTab(i);toast(t.dataset.name+" opens its own screen");
    setTimeout(function(){setTab(current==="saved"?4:2)},1100);
  })});

  /* toast with optional action */
  var tt;
  function toast(m,act){
    var t=$("toast");t.innerHTML="<span>"+esc(m)+"</span>"+(act?'<button type="button">'+esc(act.label)+"</button>":"");
    if(act)t.querySelector("button").onclick=function(){act.fn();t.classList.remove("on")};
    t.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on")},act?4200:1900);
  }

  /* parent height (unchanged contract) */
  var hq=0;
  function notifyParentHeight(){
    if(window.parent===window||hq)return;
    hq=requestAnimationFrame(function(){hq=0;try{window.parent.postMessage({type:"momin-duas-height-v1",height:Math.max(document.documentElement.scrollHeight,document.body.scrollHeight)},location.origin)}catch(_){}});
  }
  window.addEventListener("resize",notifyParentHeight);
  new MutationObserver(notifyParentHeight).observe(view,{childList:true,subtree:true});

  stack=[key()];
  route();
  setTimeout(notifyParentHeight,100);setTimeout(notifyParentHeight,450);
})();
</script>
</body>
</html>
