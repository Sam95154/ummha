  var HILLS={
    dome:'<path class="h2" d="M0 120V70C40 52 80 50 110 64C140 78 170 60 200 76V120Z"/><path class="h1" d="M30 120V84C50 62 90 58 120 72C150 86 175 80 200 92V120Z"/>',
    peaks:'<path class="h2" d="M0 120V58L38 24L76 62L108 40L146 70L176 52L200 72V120Z"/><path class="h1" d="M0 120V84L44 50L92 90L124 70L170 96L200 80V120Z"/>',
    city:'<path class="h2" d="M0 120V70H18V48L30 34L42 48V70H70L82 54L96 70H120V44L134 28L148 44V70H200V120Z"/><path class="h1" d="M0 120V92H40L60 74L84 92H130L150 80L176 92H200V120Z"/>'
  };
  // collections: id, name, sky top, sky bottom, hills, icon
  var C=[
    {id:"morning",n:"Morning & Evening",a:"#4e5f86",b:"#d9a679",h:"dome",i:"sunrise",d:"Remembrances for the start and the end of the day."},
    {id:"mosque",n:"Prayer & Mosque",a:"#6d8f88",b:"#cbb47c",h:"city",i:"mosque",d:"Words for going to the mosque and for prayer."},
    {id:"praise",n:"Praising Allah",a:"#52628a",b:"#dca97c",h:"dome",i:"spark",d:"Glorifying and thanking Allah."},
    {id:"travel",n:"Travel",a:"#7d96a0",b:"#c9b07f",h:"dome",i:"compass",d:"For leaving home, journeys and returning."},
    {id:"joy",n:"Joy & Distress",a:"#6a8c88",b:"#c2b284",h:"peaks",i:"hands",d:"For happiness, worry and hard days."},
    {id:"home",n:"Home & Family",a:"#7f9a92",b:"#c9b27e",h:"peaks",i:"house",d:"For entering the home and caring for family."},
    {id:"food",n:"Food & Drink",a:"#cc9b44",b:"#6e6b3c",h:"dome",i:"plate",d:"Before and after eating and drinking."},
    {id:"sleep",n:"Sleep & Waking",a:"#2f4d70",b:"#6a6488",h:"dome",i:"moon",d:"For going to bed and rising in the morning."},
    {id:"protect",n:"Protection",a:"#71908c",b:"#c8b383",h:"peaks",i:"shield",d:"Seeking Allah's protection."},
    {id:"forgive",n:"Forgiveness",a:"#4d6286",b:"#d9a97c",h:"dome",i:"drop",d:"Asking for forgiveness and turning back."},
    {id:"hajj",n:"Hajj & Umrah",a:"#7f9b92",b:"#c7b07b",h:"city",i:"kaaba",d:"Words for the pilgrimage."},
    {id:"sick",n:"Sickness & Loss",a:"#7a9784",b:"#c4b27f",h:"peaks",i:"leaf",d:"For illness, healing and times of loss."}
  ];
  var CM={};C.forEach(function(c){CM[c.id]=c});
  var DAILY={id:"daily",n:"Daily adhkar",a:"#3b4c76",b:"#d8a67a",h:"dome",i:"moon",d:"Morning, evening, and everyday remembrances"};
  var ITEMS=[
    {id:"m1",t:"A morning remembrance",s:"Hisn al-Muslim · Morning remembrance",c:["morning","daily"]},
    {id:"m2",t:"Protection in the morning and evening",s:"Hisn al-Muslim · Morning and evening adhkar",c:["morning","protect"]},
    {id:"f1",t:"The master supplication for forgiveness",s:"Sahih al-Bukhari 6306 · Hisn al-Muslim 90",c:["forgive"]},
    {id:"s1",t:"Before sleeping",s:"Sahih al-Bukhari 6324 · Hisn al-Muslim 99",c:["sleep","daily"]},
    {id:"s2",t:"Upon waking",s:"Sahih al-Bukhari 6312 · Hisn al-Muslim 100",c:["sleep"]},
    {id:"q1",t:"On entering the mosque",s:"Sahih Muslim 713 · Hisn al-Muslim 20",c:["mosque"]},
    {id:"q2",t:"On leaving the mosque",s:"Sahih Muslim 713 · Hisn al-Muslim 21",c:["mosque"]},
    {id:"j1",t:"A prayer for this life and the next",s:"Quran 2:201",c:["joy"]}
  ];
  // m1 also belongs to daily; protect belongs to daily too so the hero says 3
  ITEMS[1].c.push("daily");ITEMS[3].c=["sleep"]; ITEMS[3].c.push("daily");
  var BY={};ITEMS.forEach(function(x){BY[x.id]=x});
  function inCol(id){return ITEMS.filter(function(x){return x.c.indexOf(id)>-1})}
  function cnt(id){var n=inCol(id).length;return n?n+(n===1?" dua":" duas"):"Coming soon"}

  /* ---------- state ---------- */
  var RECENT_BASE=11;           // views already recorded in the app before this session
  var saved=[],seen=[];
  try{saved=JSON.parse(localStorage.getItem("duas-saved")||"[]")||[]}catch(e){}
  try{seen=JSON.parse(localStorage.getItem("duas-seen")||"[]")||[]}catch(e){}
  function persist(){try{localStorage.setItem("duas-saved",JSON.stringify(saved));localStorage.setItem("duas-seen",JSON.stringify(seen))}catch(e){}}
  function isSaved(id){return saved.indexOf(id)>-1}
  function recentsN(){return RECENT_BASE+seen.length}

  /* ---------- partials ---------- */
  function scene(c){
    return '<div class="scene" style="--s1:'+c.a+';--s2:'+c.b+'"><i class="star"></i><svg class="hills" viewBox="0 0 200 120" preserveAspectRatio="none" aria-hidden="true">'+HILLS[c.h]+'</svg><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-'+c.i+'"/></svg></div>';
  }
  function colCard(c,mode,d){
    return '<a class="ccard" href="#c-'+c.id+'" style="--d:'+d+'">'+scene(c)+'<div class="cb"><b>'+esc(c.n)+'</b><span>'+cnt(c.id)+'</span>'+(mode==="grid2"?'<em>Explore collection <span aria-hidden="true">↗</span></em>':'')+'</div></a>';
  }
  function itemRow(x,d){
    var on=isSaved(x.id);
    return '<div class="item" data-id="'+x.id+'" style="--d:'+d+'" tabindex="0" role="link"><span class="ib"><svg class="i"><use href="#ic-doc"/></svg></span>'+
      '<div class="tx"><b>'+esc(x.t)+'</b><span>'+esc(x.s)+'</span></div>'+
      '<button class="st" aria-label="'+(on?"Remove from saved":"Save")+' '+esc(x.t)+'" aria-pressed="'+on+'" data-st="'+x.id+'"><svg class="i"><use href="#ic-star"/></svg></button>'+
      '<span class="go" aria-hidden="true"><svg class="i"><use href="#ic-arrow"/></svg></span></div>';
  }
  function listHTML(arr){return '<div class="list">'+arr.map(function(x,i){return itemRow(x,i)}).join("")+'</div>'}
  function emptyHTML(icon,title,msg){return '<div class="empty"><div class="eico"><svg class="i"><use href="#ic-'+icon+'"/></svg></div><b>'+esc(title)+'</b>'+esc(msg)+'</div>'}

  /* ---------- views ---------- */
  var view=$("view"),current="home";
  function homeHTML(){
    var rail=C.slice(0,6).map(function(c,i){return colCard(c,"rail",i)}).join("");
    var ess=["joy","home","food","sleep"].map(function(id,i){return colCard(CM[id],"grid2",i)}).join("");
    return '<div class="search" id="searchBox" style="--d:0"><svg class="i"><use href="#ic-search"/></svg><input id="q" type="search" placeholder="Search duas, occasions, or categories" autocomplete="off" aria-label="Search duas"><button class="x" id="qx" aria-label="Clear search"><svg class="i"><use href="#ic-x"/></svg></button></div>'+
    '<div id="homeBody">'+
      '<div class="quick" style="--d:1">'+
        '<button class="q" data-go="saved"><span class="qi"><svg class="i"><use href="#ic-bookmark"/></svg></span><div><b>Bookmarks</b><span><span data-count="'+saved.length+'" id="cBm">'+saved.length+'</span> saved</span></div></button>'+
        '<button class="q" data-go="recent"><span class="qi"><svg class="i"><use href="#ic-clock"/></svg></span><div><b>Recents</b><span><span id="cRc" data-count="'+recentsN()+'">'+recentsN()+'</span> viewed</span></div></button>'+
        '<button class="q" data-go="collections"><span class="qi"><svg class="i"><use href="#ic-book"/></svg></span><div><b>Hisnul Muslim</b><span>Collections</span></div></button>'+
        '<button class="q" data-parent-route="tasbeeh"><span class="qi"><svg class="i"><use href="#ic-beads"/></svg></span><div><b>Tasbih</b><span>Dhikr counter</span></div></button>'+
      '</div>'+
      '<div class="sh" style="--d:2"><div><small>A moment of remembrance</small><h2>Daily Remembrances</h2></div><a href="#daily">See all <span aria-hidden="true">↗</span></a></div>'+
      '<a class="hero" href="#daily" style="--d:2">'+scene(DAILY)+'<div class="hb2"><span class="tag">Curated collection</span><h3>Daily adhkar</h3><p>'+esc(DAILY.d)+'</p><div class="ft"><span>'+inCol("daily").length+' supplications in this collection</span><span class="ar"><svg class="i"><use href="#ic-arrow"/></svg></span></div></div></a>'+
      '<div class="sh" style="--d:3"><div><small>Explore collections</small><h2>Hisnul Muslim</h2></div><a href="#collections">View all <span aria-hidden="true">↗</span></a></div>'+
      '<div class="railwrap" style="--d:3"><div class="rail">'+rail+'</div></div>'+
      '<div class="sh" style="--d:4"><div><small>From the Quran &amp; daily life</small><h2>Essential Duas</h2></div><a href="#collections">See all <span aria-hidden="true">↗</span></a></div>'+
      '<div class="grid" style="--d:4">'+ess+'</div>'+
      '<p class="note" style="--d:5">A source-linked starter collection. Check each reference for original text and narration context.</p>'+
    '</div><div id="results" hidden></div>';
  }
  function collectionsHTML(){
    return '<div class="grid" style="margin-top:20px">'+C.map(function(c,i){return colCard(c,"grid",i)}).join("")+'</div>';
  }
  function listViewHTML(c){
    var arr=inCol(c.id);
    var head='<div class="banner" style="--d:0">'+scene(c)+'<div class="bt"><h2>'+esc(c.n)+'</h2><p>'+esc(c.d)+'</p></div></div>';
    if(!arr.length) return head+emptyHTML("book","Duas are on the way","This collection is being prepared with sources for every dua.");
    return head+'<p class="lbl" style="--d:1">'+cnt(c.id)+' · tap the star to save one</p>'+listHTML(arr);
  }
  function savedHTML(){
    var arr=saved.map(function(id){return BY[id]}).filter(Boolean);
    if(!arr.length) return emptyHTML("star","Nothing saved yet","Tap the star on any dua to keep it here.");
    return '<p class="lbl">'+arr.length+(arr.length===1?" dua":" duas")+' saved</p>'+listHTML(arr);
  }
  function recentHTML(){
    var arr=seen.slice().reverse().map(function(id){return BY[id]}).filter(Boolean);
    if(!arr.length) return emptyHTML("clock","No recent duas yet","Open a supplication to see it here.");
    return '<p class="lbl">'+arr.length+(arr.length===1?" dua":" duas")+' recently viewed</p>'+listHTML(arr);
  }

  var TITLES={home:"Duas",collections:"Hisnul Muslim collections",saved:"Saved duas",recent:"Recent duas"};
  function route(){
    var h=(location.hash||"").slice(1),html,title,type="home",id=null;
    if(!h||h==="home"){type="home";html=homeHTML();title="Duas"}
    else if(h==="collections"){type="collections";html=collectionsHTML();title=TITLES.collections}
    else if(h==="saved"){type="saved";html=savedHTML();title=TITLES.saved}
    else if(h==="recent"){type="recent";html=recentHTML();title=TITLES.recent}
    else if(h==="daily"){type="list";id="daily";html=listViewHTML(DAILY);title=DAILY.n}
    else if(h.indexOf("c-")===0&&CM[h.slice(2)]){type="list";id=h.slice(2);html=listViewHTML(CM[id]);title=CM[id].n}
    else{type="home";html=homeHTML();title="Duas"}
    current=type;view.innerHTML=html;window.scrollTo(0,0);
    if(type!=="home"){
      var back=document.createElement("button");
      back.type="button";back.className="momin-duas-inner-back";
      back.textContent="← Back to Duas";
      back.addEventListener("click",function(){location.hash="home"});
      view.insertBefore(back,view.firstChild);
    }
    var t=$("title");t.textContent=title;t.classList.remove("swap");void t.offsetWidth;t.classList.add("swap");
    $("backBtn").classList.toggle("ph",type==="home");
    setTab(type==="saved"?4:2);
    if(type==="home")bindSearch();
    pulseCounts();
  }
  window.addEventListener("hashchange",route);

  /* ---------- actions ---------- */
  $("backBtn").onclick=function(){
    var h=(location.hash||"").slice(1);
    location.hash=(h.indexOf("c-")===0)?"collections":"home";
  };
  $("actBtn").onclick=function(){location.hash="saved"};

  view.addEventListener("click",function(e){
    var st=e.target.closest("[data-st]");
    if(st){e.stopPropagation();toggle(st.dataset.st,st);return}
    var it=e.target.closest(".item");
    if(it){open(it.dataset.id);return}
    var g=e.target.closest("[data-go]");
    if(g){location.hash=g.dataset.go;return}
    var parentRoute=e.target.closest("[data-parent-route]");
    if(parentRoute){
      try{
        if(window.parent!==window&&window.parent.MominDuasBridgeV1){
          window.parent.MominDuasBridgeV1.navigate(parentRoute.dataset.parentRoute);
          return;
        }
      }catch(_){}
      toast("This section is not available right now");return;
    }
    var t=e.target.closest("[data-toast]");
    if(t)toast(t.dataset.toast);
  });
  view.addEventListener("keydown",function(e){
    if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("item")){e.preventDefault();open(e.target.dataset.id)}
  });
  function open(id){
    if(seen.indexOf(id)<0){seen.push(id);persist()}
    try{
      if(window.parent!==window&&window.parent.MominDuasBridgeV1){
        window.parent.MominDuasBridgeV1.openDua(id);
        return;
      }
    }catch(_){}
    toast("Opening “"+BY[id].t+"”");
  }
  function toggle(id,btn){
    var k=saved.indexOf(id);
    if(k>-1)saved.splice(k,1);else saved.push(id);
    persist();updateAct();
    var on=isSaved(id);
    if(current==="saved"){view.innerHTML=savedHTML();toast("Removed from saved");return}
    btn.setAttribute("aria-pressed",on);
    btn.classList.remove("pop");
    toast(on?"Saved":"Removed from saved");
  }
  function updateAct(){
    var c=$("actCnt");c.hidden=!saved.length;c.textContent=saved.length;
  }
  updateAct();

  /* search */
  function bindSearch(){
    var q=$("q"),box=$("searchBox"),body=$("homeBody"),res=$("results");
    q.addEventListener("input",function(){
      var v=q.value.trim().toLowerCase();
      box.classList.toggle("has",!!q.value);
      if(!v){body.hidden=false;res.hidden=true;return}
      var hits=ITEMS.filter(function(x){
        var cn=x.c.map(function(i){return CM[i]?CM[i].n:""}).join(" ");
        return (x.t+" "+x.s+" "+cn).toLowerCase().indexOf(v)>-1;
      });
      var cols=C.filter(function(c){return c.n.toLowerCase().indexOf(v)>-1});
      var html="";
      if(cols.length)html+='<p class="lbl">Collections</p><div class="grid" style="margin-top:12px">'+cols.map(function(c,i){return colCard(c,"grid",i)}).join("")+'</div>';
      if(hits.length)html+='<p class="lbl">Duas</p>'+listHTML(hits);
      if(!html)html=emptyHTML("search","No matches","Try a word like sleep, mosque or forgiveness.");
      body.hidden=true;res.hidden=false;res.innerHTML=html;
    });
    $("qx").onclick=function(){q.value="";q.dispatchEvent(new Event("input"));q.focus()};
  }

  /* count-up on the quick tiles */
  function pulseCounts(){
    ["cBm","cRc"].forEach(function(id){
      var el=$(id);if(!el)return;var to=+el.dataset.count,t0=null;
      function step(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/900),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e);if(p<1)requestAnimationFrame(step)}
      el.textContent=0;requestAnimationFrame(step);
    });
  }

  /* header border once scrolled */
  window.addEventListener("scroll",function(){$("bar").classList.toggle("scrolled",window.scrollY>6)},{passive:true});

  /* tabs */
  var tabs=document.querySelectorAll(".tab"),ind=$("ind");
  function setTab(i){
    tabs.forEach(function(t,k){if(k===i)t.setAttribute("aria-current","page");else t.removeAttribute("aria-current")});
    ind.style.transform="translateX("+(i*100)+"%)";
  }
  tabs.forEach(function(t){t.addEventListener("click",function(){
    var i=+t.dataset.i;
    if(i===2){location.hash="home";window.scrollTo({top:0,behavior:"smooth"});route();return}
    if(i===4){location.hash="saved";return}
    setTab(i);toast(t.dataset.name+" opens its own screen");
    setTimeout(function(){setTab(current==="saved"?4:2)},1100);
  })});

  var tt;function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on")},1900)}

  function syncParentTheme(){
    try{
      if(window.parent!==window){
        var theme=window.parent.document.documentElement.getAttribute("data-theme");
        if(theme)document.documentElement.setAttribute("data-theme",theme);
      }
    }catch(_){}
  }
  function notifyParentHeight(){
    if(window.parent===window)return;
    try{
      window.parent.postMessage({
        type:"momin-duas-height-v1",
        height:Math.max(document.documentElement.scrollHeight,document.body.scrollHeight)
      },location.origin);
    }catch(_){}
  }
  syncParentTheme();
  try{
    if(window.parent!==window&&typeof MutationObserver!=="undefined"){
      new MutationObserver(syncParentTheme).observe(window.parent.document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
    }
  }catch(_){}
  window.addEventListener("resize",notifyParentHeight);
  new MutationObserver(notifyParentHeight).observe(document.body,{childList:true,subtree:true,attributes:true});
  route();
  setTimeout(notifyParentHeight,100);
  setTimeout(notifyParentHeight,450);
})();
</script></body></html>
