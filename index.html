/* QURAN READER SETTINGS MODAL FIX */
.quran-reader .reader-settings{
  position:fixed;
  z-index:60;
  top:max(86px,calc(env(safe-area-inset-top) + 74px));
  left:50%;
  right:auto;
  transform:translateX(-50%);
  width:min(520px,calc(100vw - 28px));
  max-width:520px;
  max-height:calc(100vh - 108px);
  max-height:calc(100dvh - 108px);
  overflow-y:auto;
  overscroll-behavior:contain;
  box-sizing:border-box;
  padding:20px clamp(16px,4vw,24px);
  background:#fffdf5;
  color:#30271f;
  border:1px solid #d9cdb4;
  border-radius:20px;
  box-shadow:0 18px 48px rgba(0,0,0,.34);
  font:14px/1.45 var(--sans);
  -webkit-text-size-adjust:100%;
}
.quran-reader .reader-settings::before{
  content:"Reading settings";
  display:block;
  margin:0 0 12px;
  padding:0 0 12px;
  color:#30271f;
  border-bottom:1px solid #e7ddc8;
  font-size:17px;
  font-weight:700;
  line-height:1.3;
}
.quran-reader .reader-settings[hidden]{display:none}
.quran-reader .reader-settings .reader-setting{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  min-width:0;
  padding:12px 0;
  color:#30271f;
}
.quran-reader .reader-settings .reader-setting>span{
  flex:1 1 auto;
  min-width:0;
  color:#30271f;
  font-size:14px;
  font-weight:600;
  line-height:1.4;
  overflow-wrap:anywhere;
}
.quran-reader .reader-settings .reader-setting select{
  flex:0 1 220px;
  width:50%;
  min-width:0;
  max-width:220px;
  padding:10px 30px 10px 11px;
  border:1px solid #cfc3aa;
  border-radius:10px;
  background:#fff;
  color:#30271f;
  font:500 13px/1.35 var(--sans);
  outline-color:#24543d;
}
.quran-reader .reader-settings .reader-setting select option{
  background:#fff;
  color:#30271f;
}
.quran-reader .reader-settings .reader-setting input[type=range]{
  flex:0 1 220px;
  width:48%;
  max-width:220px;
  min-width:90px;
  accent-color:#24543d;
}
.quran-reader .reader-settings .reader-setting input[type=checkbox]{
  flex:0 0 20px;
  width:20px;
  height:20px;
  margin:0 4px;
  accent-color:#24543d;
}
@media(max-width:480px){
  .quran-reader .reader-settings{
    top:max(74px,calc(env(safe-area-inset-top) + 64px));
    width:calc(100vw - 24px);
    max-height:calc(100vh - 92px);
    max-height:calc(100dvh - 92px);
    padding:17px 16px;
    border-radius:18px;
  }
  .quran-reader .reader-settings .reader-setting{
    align-items:flex-start;
    gap:12px;
    padding:12px 0;
  }
  .quran-reader .reader-settings .reader-setting>span{
    font-size:13px;
  }
  .quran-reader .reader-settings .reader-setting select{
    flex-basis:54%;
    width:54%;
    max-width:54%;
    font-size:12px;
  }
  .quran-reader .reader-settings .reader-setting input[type=range]{
    flex-basis:48%;
    width:48%;
    min-width:80px;
  }
}


/* QURAN THEMED SURAH PLATE — mobile-safe ornament and metadata */
.quran-reader .surah-plate{
  --sp-ink:#183f30;
  --sp-muted:#60735d;
  --sp-gold:#b59a58;
  position:relative;
  isolation:isolate;
  display:grid;
  grid-template-columns:minmax(42px,.55fr) minmax(0,2fr) minmax(42px,.55fr);
  align-items:center;
  gap:clamp(7px,2vw,18px);
  width:100%;
  max-width:780px;
  min-height:132px;
  margin:30px auto 22px;
  padding:28px clamp(12px,3vw,24px) 18px;
  box-sizing:border-box;
  overflow:hidden;
  border:2px solid var(--sp-gold);
  outline:1px solid var(--sp-gold);
  outline-offset:3px;
  background:
    radial-gradient(ellipse at center,rgba(255,255,255,.28),transparent 62%),
    linear-gradient(100deg,#15583e 0%,#cfe6c8 14%,#f3f1dc 50%,#cfe6c8 86%,#15583e 100%);
  color:var(--sp-ink);
  text-align:center;
  box-shadow:inset 0 0 0 4px rgba(255,251,226,.85),0 6px 18px rgba(0,0,0,.08);
}
.quran-reader .surah-plate::before{
  content:"";
  position:absolute;
  z-index:0;
  inset:7px;
  border:1px solid rgba(181,154,88,.7);
  pointer-events:none;
}
.quran-reader .surah-plate .sp-c{
  position:absolute;
  z-index:2;
  color:var(--sp-gold);
  font:18px/1 Georgia,serif;
  pointer-events:none;
}
.quran-reader .surah-plate .sp-c::before{content:"✧"}
.quran-reader .surah-plate .sp-c.a{top:10px;left:12px}
.quran-reader .surah-plate .sp-c.b{top:10px;right:12px}
.quran-reader .surah-plate .sp-c.c{bottom:10px;left:12px}
.quran-reader .surah-plate .sp-c.d{bottom:10px;right:12px}
.quran-reader .surah-plate .sp-badge{
  position:absolute;
  z-index:2;
  top:7px;
  left:50%;
  display:grid;
  place-items:center;
  width:22px;
  height:22px;
  transform:translateX(-50%);
  color:var(--sp-gold);
}
.quran-reader .surah-plate .sp-badge svg{display:block;width:100%;height:100%}
.quran-reader .surah-plate .sp-orn{
  position:relative;
  z-index:1;
  display:grid;
  place-items:center;
  min-width:0;
  color:var(--sp-gold);
  opacity:.95;
}
.quran-reader .surah-plate .sp-orn svg{
  display:block;
  width:100%;
  max-width:58px;
  height:auto;
  max-height:66px;
}
.quran-reader .surah-plate .sp-mid{
  position:relative;
  z-index:1;
  min-width:0;
  padding-top:7px;
}
.quran-reader .surah-plate .sp-no{
  margin:0 0 3px;
  color:var(--sp-muted);
  font:700 10px/1.4 var(--sans);
  letter-spacing:.15em;
  text-transform:uppercase;
}
.quran-reader .surah-plate .sp-ar{
  max-width:100%;
  margin:0 auto 5px;
  color:var(--sp-ink);
  font:500 clamp(25px,5.4vw,35px)/1.5 'Noto Naskh Arabic','Amiri','Traditional Arabic',Georgia,serif;
  direction:rtl;
  unicode-bidi:plaintext;
  white-space:normal;
  overflow-wrap:anywhere;
}
.quran-reader .surah-plate .sp-meta{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
  max-width:100%;
  color:var(--sp-muted);
  font:500 11px/1.5 var(--sans);
}
.quran-reader .surah-plate .sp-meta span{min-width:0;overflow-wrap:anywhere}
.quran-reader .surah-plate .sp-meta b{font-weight:800}
.quran-reader .surah-plate .sp-meta i{
  display:block;
  flex:0 0 3px;
  width:3px;
  height:3px;
  border-radius:50%;
  background:var(--sp-gold);
}
.quran-reader .surah-plate .sp-arches{
  position:absolute;
  z-index:0;
  inset:9px 13%;
  border:1px solid rgba(181,154,88,.25);
  border-radius:48% 48% 8px 8px;
  pointer-events:none;
}
.quran-reader .reader-loadstatus{
  display:block;
  width:100%;
  max-width:780px;
  margin:20px auto 18px;
  padding:0 8px;
  box-sizing:border-box;
  color:var(--quran-ink);
  font:13px/1.55 var(--sans);
  text-align:center;
  white-space:normal;
  overflow-wrap:anywhere;
}
.quran-reader.reader-night .surah-plate{
  --sp-ink:#f3e7c8;
  --sp-muted:#d1bd86;
  --sp-gold:#d1b56e;
  background:
    radial-gradient(ellipse at center,rgba(60,119,82,.34),transparent 65%),
    linear-gradient(100deg,#0c3a2c 0%,#174a38 20%,#1d513c 50%,#174a38 80%,#0c3a2c 100%);
  box-shadow:inset 0 0 0 4px rgba(225,207,152,.08),0 6px 18px rgba(0,0,0,.24);
}
.quran-reader.reader-night .surah-plate::before{border-color:rgba(209,181,110,.55)}
.quran-reader.reader-night .surah-plate .sp-arches{border-color:rgba(209,181,110,.2)}
.quran-reader.reader-white .surah-plate{
  --sp-ink:#183f30;
  --sp-muted:#60735d;
  --sp-gold:#a88d4f;
}
@media(max-width:700px){
  .quran-reader .surah-plate{
    grid-template-columns:28px minmax(0,1fr) 28px;
    gap:5px;
    min-height:126px;
    margin:24px auto 18px;
    padding:25px 10px 16px;
  }
  .quran-reader .surah-plate .sp-orn svg{width:28px;max-width:28px;max-height:42px}
  .quran-reader .surah-plate .sp-c{font-size:14px}
  .quran-reader .surah-plate .sp-c.a{top:8px;left:8px}
  .quran-reader .surah-plate .sp-c.b{top:8px;right:8px}
  .quran-reader .surah-plate .sp-c.c{bottom:8px;left:8px}
  .quran-reader .surah-plate .sp-c.d{bottom:8px;right:8px}
  .quran-reader .surah-plate .sp-badge{top:5px;width:17px;height:17px}
  .quran-reader .surah-plate .sp-mid{padding-top:8px}
  .quran-reader .surah-plate .sp-no{font-size:9px;letter-spacing:.12em}
  .quran-reader .surah-plate .sp-ar{font-size:clamp(23px,6.2vw,30px);line-height:1.55}
  .quran-reader .surah-plate .sp-meta{font-size:10px;gap:5px}
  .quran-reader .surah-plate .sp-arches{inset:8px 10%}
  .quran-reader .reader-loadstatus{
    margin:17px auto 18px;
    padding:0 4px;
    font-size:12px;
    line-height:1.6;
  }
}

function tasbeehPage(){return title('Digital tasbeeh','Keep count of your dhikr','Today: '+tasbih+'')+'<div class="grid g2"><div class="card tasbeeh"><div class="sub">SUBHANALLAH</div><div class="counter" id="counter">'+tasbih+'</div><button class="counterbtn" onclick="increment()">Tap to count</button><button class="smallbtn" style="margin-top:16px" onclick="resetCounter()">Reset counter</button></div><div class="card"><h3>Choose a dhikr</h3><div class="sub">Set your intention and begin</div><div class="dua-list" style="margin-top:14px"><button class="dua" onclick="setDhikr(&quot;Subhanallah&quot;)"><b>Subhanallah</b><div class="sub">Glory be to Allah</div></button><button class="dua" onclick="setDhikr(&quot;Alhamdulillah&quot;)"><b>Alhamdulillah</b><div class="sub">All praise is for Allah</div></button><button class="dua" onclick="setDhikr(&quot;Allahu Akbar&quot;)"><b>Allahu Akbar</b><div class="sub">Allah is the Greatest</div></button><button class="dua" onclick="setDhikr(&quot;Astaghfirullah&quot;)"><b>Astaghfirullah</b><div class="sub">I seek forgiveness from Allah</div></button></div><div class="sectionhead"><h2>Daily goal</h2></div><div class="rowbetween"><span class="sub">Progress toward 100</span><b id="goalText">'+Math.min(tasbih,100)+'%</b></div><div class="progress"><i id="goalBar" style="width:'+Math.min(tasbih,100)+'%"></i></div></div></div>'}
function calendarPage(){let days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],offset=new Date(new Date().getFullYear(),new Date().getMonth(),1).getDay(),n=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();return title('Islamic calendar','Important dates and the Hijri calendar','1448 AH')+'<div class="grid g2"><div class="card"><div class="rowbetween"><div><h3>'+new Intl.DateTimeFormat('en',{month:'long',year:'numeric'}).format(new Date())+'</h3><div class="sub">16 Rabi al-Thani 1448 AH</div></div><span class="tag">Today</span></div><div class="calendar" style="margin-top:17px">'+days.map(x=>'<div class="weekday">'+x+'</div>').join('')+Array(offset).fill('<div></div>').join('')+Array.from({length:n},(_,i)=>'<div class="'+(i+1===new Date().getDate()?'today':'')+'">'+(i+1)+'</div>').join('')+'</div></div><div class="card"><h3>Upcoming occasions</h3><div class="dua-list" style="margin-top:14px"><div class="dua"><b>Islamic New Year</b><div class="sub">1 Muharram 1449 · estimated</div></div><div class="dua"><b>Ashura</b><div class="sub">10 Muharram 1449 · estimated</div></div><div class="dua"><b>Mawlid an-Nabi</b><div class="sub">12 Rabi al-Awwal 1449 · estimated</div></div><div class="dua"><b>Ramadan begins</b><div class="sub">1 Ramadan 1449 · subject to moon sighting</div></div></div><p class="sub" style="line-height:1.6;margin-top:14px">Dates are estimates and may vary by location and moon sighting.</p></div></div>'}
function settingsPage(){return title('Settings','Personalize your MOMIN experience','Preferences saved on this device')+'<div class="grid g2"><div class="card"><h3>Prayer settings</h3><div class="setting"><div><b>Location</b><small id="settingLocation">London, United Kingdom</small></div><button class="smallbtn" onclick="setLocation()">Use my location</button></div><div class="setting"><div><b>Calculation method</b><small>Used for prayer times</small></div><select onchange="saveSetting(&quot;method&quot;,this.value)"><option>Muslim World League</option><option>ISNA</option><option>Egyptian General Authority</option><option>Umm Al-Qura University</option><option>University of Karachi</option></select></div><div class="setting"><div><b>Asr calculation</b><small>Juristic method</small></div><select><option>Standard</option><option>Hanafi</option></select></div><div class="setting"><div><b>Prayer notifications</b><small>Reminder at prayer time</small></div><input class="toggle" type="checkbox" checked onchange="saveSetting(&quot;notifications&quot;,this.checked)"></div><div class="setting"><div><b>Adhan sound</b><small>Audio reminder</small></div><select><option>Gentle chime</option><option>Adhan · Makkah</option><option>Adhan · Madinah</option><option>Silent</option></select></div></div><div class="card"><h3>Reading & appearance</h3><div class="setting"><div><b>Quran translation</b><small>Default translation</small></div><select><option>English — Sahih International</option><option>English — Yusuf Ali</option><option>Arabic only</option></select></div><div class="setting"><div><b>Language</b><small>App display language</small></div><select><option>English</option><option>العربية</option><option>Bahasa Melayu</option><option>اردو</option></select></div><div class="setting"><div><b>Appearance</b><small>App theme</small></div><select onchange="setTheme(this.value)"><option>Light</option><option>Sepia</option><option>Dark</option></select></div><div class="setting"><div><b>Keep screen awake</b><small>While reading Quran</small></div><input class="toggle" type="checkbox"></div></div></div><div class="card" style="margin-top:16px"><h3>About MOMIN</h3><div class="setting"><span>Version</span><span class="sub">1.0.0 · Web companion</span></div><div class="setting"><span>Privacy</span><button class="plain" onclick="toast(&quot;Your preferences are stored locally on this device&quot;)">Your data →</button></div></div>'}
function render(){navBuild();let html={home,prayers:prayersPage,quran:quranPage,qibla:qiblaPage,duas:duasPage,tasbeeh:tasbeehPage,calendar:calendarPage,settings:settingsPage}[page]();document.getElementById('view').innerHTML=html;if(page==='quran'){let f=document.getElementById('surahSearch');if(f)f.value=''}document.getElementById('hijriTop').textContent='16 Rabi al-Thani 1448'}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function togglePrayer(n){done[n]=!done[n];localStorage.setItem('noor-prayers',JSON.stringify(done));render()}
function filterSurahs(q){document.getElementById('surahList').innerHTML=surahList(q)}
function selectSurah(s){selectedSurah=s;localStorage.setItem('noor-surah',s);toast('Reading position saved: '+s);render()}
function filterDuas(f){document.getElementById('duaList').innerHTML=duaList(f)}
function increment(){tasbih++;localStorage.setItem('noor-tasbih',tasbih);document.getElementById('counter').textContent=tasbih;let g=Math.min(tasbih,100);document.getElementById('goalText').textContent=g+'%';document.getElementById('goalBar').style.width=g+'%'}
function resetCounter(){tasbih=0;localStorage.setItem('noor-tasbih',0);document.getElementById('counter').textContent=0;document.getElementById('goalText').textContent='0%';document.getElementById('goalBar').style.width='0%'}
function setDhikr(s){document.querySelector('.tasbeeh .sub').textContent=s.toUpperCase();toast('Dhikr set: '+s)}
function saveSetting(k,v){localStorage.setItem('noor-'+k,v);toast('Preference saved')}
function setTheme(v){document.body.style.filter=v==='Dark'?'invert(.88) hue-rotate(180deg)':v==='Sepia'?'sepia(.25)':''}
function setLocation(){if(!navigator.geolocation){toast('Location is unavailable in this browser');return}toast('Requesting your location…');navigator.geolocation.getCurrentPosition(pos=>{let s='Location enabled';document.getElementById('locationName').textContent=s;let l=document.getElementById('settingLocation');if(l)l.textContent=s;localStorage.setItem('noor-location',s);toast('Location enabled for local prayer settings')},()=>toast('Location permission was not granted'),{timeout:7000})}
function toast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
render();
</script>

<script>
/* Live data and complete reading flows */
const API_STORE={city:localStorage.getItem('noor-city')||'',country:localStorage.getItem('noor-country')||'',method:localStorage.getItem('noor-method')||'3',methodMode:localStorage.getItem('noor-method-mode')||'auto'};
let livePrayer=null, liveQibla=null, chapters=[], currentVerses=[], currentAudio=null, chapterPage=1, audioEl=new Audio();
const PRAYER_METHODS={"Shia Ithna-Ashari (Jafari) / Leva Inst., Qom":"0","University of Islamic Sciences, Karachi":"1","Islamic Society of North America (ISNA)":"2","Muslim World League (MWL)":"3","Umm al-Qura University, Makkah":"4","Egyptian General Authority of Survey":"5","Institute of Geophysics, University of Tehran":"7","Gulf Region":"8","Kuwait":"9","Qatar":"10","Majlis Ugama Islam Singapura (MUIS)":"11","Union Organisation Islamique de France (UOIF)":"12","Diyanet İşleri Başkanlığı":"13","Spiritual Administration of Muslims of Russia":"14","Moonsighting Committee Worldwide":"15","Dubai, UAE (Experimental/Research)":"16","Jabatan Kemajuan Islam Malaysia (JAKIM)":"17","Tunisia":"18","Algeria":"19","Kementerian Agama Republik Indonesia (KEMENAG)":"20","Morocco":"21","Comunidade Islâmica de Lisboa":"22","Jordan":"23"};
async function getJSON(url){const r=await fetch(url);if(!r.ok)throw Error('Service returned '+r.status);const j=await r.json();if(j.code&&j.code>=400)throw Error(j.status||'Service error');return j}
function apiDate(){let d=new Date();return [String(d.getDate()).padStart(2,'0'),String(d.getMonth()+1).padStart(2,'0'),d.getFullYear()].join('-')}
function syncLocationLabels(){['locationName','settingLocation'].forEach(id=>{let e=document.getElementById(id);if(e)e.textContent=API_STORE.city+', '+API_STORE.country})}
async function loadPrayerData(){if(!API_STORE.city||!API_STORE.country)return;try{let autoMode=(API_STORE.methodMode||'auto')!=='manual',method=API_STORE.method||'3';let url='https://api.aladhan.com/v1/timingsByCity/'+apiDate()+'?city='+encodeURIComponent(API_STORE.city)+'&country='+encodeURIComponent(API_STORE.country)+(autoMode?'':'&method='+encodeURIComponent(method));let j=await getJSON(url);if(!j.data||!j.data.timings)throw Error('No prayer timings');livePrayer=j.data;if(autoMode&&j.data.meta&&j.data.meta.method&&j.data.meta.method.id!=null){API_STORE.method=String(j.data.meta.method.id);localStorage.setItem('noor-method',API_STORE.method)}localStorage.setItem('noor-prayer-cache',JSON.stringify({at:Date.now(),data:j.data,city:API_STORE.city,country:API_STORE.country,latitude:null,longitude:null,method:API_STORE.method,methodMode:API_STORE.methodMode||'auto'}));if(j.data.meta&&j.data.meta.latitude!=null){try{let q=await getJSON('https://api.aladhan.com/v1/qibla/'+j.data.meta.latitude+'/'+j.data.meta.longitude);liveQibla=q.data.direction;localStorage.setItem('noor-qibla',liveQibla)}catch(_){}}let h=j.data.date.hijri,top=document.getElementById('hijriTop');if(top&&h)top.textContent=h.day+' '+h.month.en+' '+h.year+' AH';syncLocationLabels();renderLivePrayerViews()}catch(e){let c=null;try{c=JSON.parse(localStorage.getItem('noor-prayer-cache')||'null')}catch(_){}if(c&&c.data&&c.data.timings&&String(c.city||'').toLowerCase()===API_STORE.city.toLowerCase()&&String(c.country||'').toLowerCase()===API_STORE.country.toLowerCase())livePrayer=c.data;else livePrayer=null;if(page==='prayers')toast('Could not refresh prayer times for '+API_STORE.city+', '+API_STORE.country+'.');renderLivePrayerViews()}}
function formatPrayerTime(s){try{return new Date('2000-01-01T'+s).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}catch(_){return s}}
function actualPrayerRows(){if(!livePrayer)return prayerRows();let t=livePrayer.timings;return [['☼','Fajr','Fajr'],['◉','Dhuhr','Dhuhr'],['◔','Asr','Asr'],['☾','Maghrib','Maghrib'],['✧','Isha','Isha']].map(([ico,n,k])=>'<div class="prayerrow"><div class="pname"><span style="color:#70906d">'+ico+'</span>'+n+'</div><span class="ptime">'+formatPrayerTime(t[k])+'</span><button class="check '+(done[n]?'done':'')+'" onclick="togglePrayer(\''+n+'\')">'+(done[n]?'✓':'')+'</button></div>').join('')}
function livePrayerInfo(){if(!livePrayer)return '';let h=livePrayer.date.hijri;return '<span>'+h.day+' '+h.month.en+' '+h.year+' AH · '+API_STORE.city+'</span>'}
const oldHome=home;home=function(){let html=oldHome();if(livePrayer){let t=livePrayer.timings;html=html.replace('Asr <span style="font-size:15px">◔</span>','Asr <span style="font-size:15px">◔</span>').replace('4:18 PM · in 00:42',formatPrayerTime(t.Asr)+' · local time').replace(/<div class="prayerrows">[\s\S]*?<\/div><\/div><\/div>/,'<div class="prayerrows">'+actualPrayerRows()+'</div></div></div>');}html=html.replace('Tuesday · '+dateText(),dateText()+' · '+API_STORE.city);return html}
prayersPage=function(){let times=livePrayer?actualPrayerRows():prayerRows();let methodOpts=Object.keys(PRAYER_METHODS).map(n=>'<option value="'+PRAYER_METHODS[n]+'" '+(API_STORE.method===PRAYER_METHODS[n]?'selected':'')+'>'+n+'</option>').join('');let t=livePrayer?.timings;return title('Prayer times','Calculated for your city · '+dateText(),livePrayerInfo())+'<div class="grid g2"><div class="card hero-card"><div class="sub">TODAY · '+API_STORE.city.toUpperCase()+'</div><h2 style="font:500 32px var(--serif);margin:18px 0 5px">Prayer schedule</h2><div class="sub">Times provided by AlAdhan · adjust to your local mosque</div><div class="statrow">'+(t?['Fajr','Dhuhr','Asr','Maghrib','Isha'].map(n=>'<span class="prayer-pill">'+n+' '+formatPrayerTime(t[n])+'</span>').join(''):'<span class="prayer-pill">Set a city to calculate prayer times</span>')+'</div></div><div class="card"><div class="rowbetween"><div><h3>Prayer tracker</h3><div class="sub">Tap a box to mark a prayer complete</div></div><span class="tag">'+Object.values(done).filter(Boolean).length+' of 5</span></div><div class="progress"><i style="width:'+Object.values(done).filter(Boolean).length*20+'%"></i></div><div class="prayerrows">'+times+'</div></div></div><div class="sectionhead"><h2>Location & calculation</h2></div><div class="card"><div class="grid g2"><label>City<input id="cityInput" class="search" style="margin:8px 0" value="'+API_STORE.city+'"></label><label>Country<input id="countryInput" class="search" style="margin:8px 0" value="'+API_STORE.country+'"></label></div><div class="rowbetween" style="gap:12px;flex-wrap:wrap"><label class="sub">Calculation method <select id="methodInput" style="padding:10px;border:1px solid var(--line);border-radius:9px;background:white;margin-left:8px">'+methodOpts+'</select></label><button class="smallbtn" onclick="applyPrayerSettings()">Update prayer times</button></div><p class="sub" style="margin:14px 0 0">Prayer calculations can differ from local mosque timetables. Confirm times with your local authority.</p></div>'}
qiblaPage=function(){let bearing=liveQibla??localStorage.getItem('noor-qibla');return title('Qibla direction','Calculated from your selected city',bearing?Math.round(bearing)+'°':'Set a city first')+'<div class="grid g2"><div class="card"><div class="rowbetween"><div><h3>Compass bearing</h3><div class="sub">Approximate city coordinates · point your phone toward the marker</div></div><span class="tag">'+(bearing?Math.round(bearing)+'°':'—')+'</span></div><div class="compass-wrap"><div class="compass"><div class="needle" style="transform:rotate('+(bearing||0)+'deg)"><span class="kaaba">⌂</span></div><span class="center-dot"></span></div></div><div style="text-align:center"><button class="smallbtn" onclick="toast(&quot;Keep your phone away from magnetic objects and recalibrate its compass&quot;)">Compass guidance</button></div></div><div"><div class="card"><h3>Qibla from '+API_STORE.city+'</h3><p class="sub" style="line-height:1.8;margin-top:12px">'+(bearing?'The calculated direction to the Kaaba is <b>'+Math.round(bearing)+'°</b> clockwise from north. The API uses coordinates resolved for your selected city.':'Set your city on the Prayer times page to calculate a bearing.')+'</p><button class="smallbtn" onclick="go(\'prayers\')">Change city / location →</button></div><div class="card soft" style="margin-top:14px"><h3>Compass accuracy</h3><p class="sub" style="line-height:1.7;margin:10px 0">This web app shows the bearing on a compass face. Device orientation sensor access varies by browser and is not enabled automatically.</p></div></div></div>'}
async function loadChapters(){try{let j=await getJSON('https://api.alquran.cloud/v1/surah');chapters=j.data;let saved=localStorage.getItem('noor-surah-number');if(saved)selectedSurah=chapters[+saved-1]?.englishName||selectedSurah;render()}catch(e){toast('Could not load Quran index. Check your connection.');}}
function apiSurahList(filter=''){let list=chapters.length?chapters:surahs.map((englishName,i)=>({number:i+1,englishName,englishNameTranslation:'',name:'القرآن'}));return list.filter(x=>(x.englishName+' '+x.englishNameTranslation+' '+x.name).toLowerCase().includes(filter.toLowerCase())).map(x=>'<div class="surahrow" onclick="readSurah('+x.number+')"><span class="num">'+x.number+'</span><span><b>'+x.englishName+'</b><small>'+(x.englishNameTranslation||'Quran')+' · '+(x.numberOfAyahs||'')+' verses · '+(x.revelationType||'')+'</small></span><span class="surah-ar">'+x.name+'</span></div>').join('')}
quranPage=function(){let chosen=chapters.find(c=>c.englishName===selectedSurah);return title('The Holy Quran','Complete Quran · Arabic and Sahih International translation','114 Surahs')+'<div class="card"><div class="rowbetween"><div><h3>'+(chosen?chosen.englishName:'Continue reading')+'</h3><div class="sub">'+(chosen?chosen.englishNameTranslation+' · '+chosen.numberOfAyahs+' verses':'Choose a Surah to begin reading')+'</div></div><div class="chips"><button class="smallbtn" onclick="playChapter()">▶ Listen</button><button class="smallbtn" onclick="stopAudio()">■ Stop</button></div></div><div id="readingArea">'+(currentVerses.length?verseMarkup():'<div class="verse"><div class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div><div class="translation">Choose a surah below to load the complete text and translation.</div></div>')+'</div><div class="rowbetween" style="margin-top:12px"><span id="loadStatus" class="sub">'+(currentVerses.length?'Reading position is saved on this device.':'Quran text loads from AlQuran Cloud when selected.')+'</span><span><button class="smallbtn" onclick="previousSurah()">← Previous</button> <button class="smallbtn" onclick="nextSurah()">Next →</button></span></div></div><div class="sectionhead"><h2>All 114 Surahs</h2></div><input class="search" placeholder="⌕   Search all surahs" oninput="document.getElementById(\'surahList\').innerHTML=apiSurahList(this.value)"><div class="card quran-list" id="surahList">'+apiSurahList()+'</div><audio id="quranAudio" controls style="width:100%;margin-top:14px;display:none"></audio>'}
function verseMarkup(){return currentVerses.map((v,i)=>'<article class="verse" style="text-align:left"><div class="rowbetween"><span class="tag">'+v.numberInSurah+'</span><button class="smallbtn" onclick="bookmarkVerse(\''+v.number+'\')">♡ Bookmark</button></div><div class="arabic" lang="ar">'+v.text+'</div><div class="translation">'+(v.translation||'')+'</div><span class="sub">Surah '+v.surah+' · Ayah '+v.numberInSurah+'</span></article>').join('')}
async function readSurah(n){selectedSurah=chapters[n-1]?.englishName||surahs[n-1];localStorage.setItem('noor-surah',selectedSurah);localStorage.setItem('noor-surah-number',n);currentVerses=[];render();let s=document.getElementById('loadStatus');if(s)s.textContent='Loading Arabic and translation…';try{let j=await getJSON('https://api.alquran.cloud/v1/surah/'+n+'/editions/quran-uthmani,en.sahih');let arabic=j.data.find(x=>x.edition.identifier==='quran-uthmani');let english=j.data.find(x=>x.edition.identifier==='en.sahih');currentVerses=arabic.ayahs.map((v,i)=>({number:v.number,numberInSurah:v.numberInSurah,text:v.text,translation:english.ayahs[i]?.text,surah:arabic.englishName}));render();localStorage.setItem('noor-last-verse',n+':1')}catch(e){toast('Quran content could not load. Please check your connection.');let x=document.getElementById('loadStatus');if(x)x.textContent='Unable to load content: '+e.message}}
async function playChapter(){if(!chapters.length){toast('Wait for the Quran index to load');return}let n=chapters.findIndex(c=>c.englishName===selectedSurah)+1;if(n<1)n=1;try{let j=await getJSON('https://api.alquran.cloud/v1/surah/'+n+'/ar.alafasy');let a=document.getElementById('quranAudio');a.src=j.data.ayahs[0].audio;a.style.display='block';await a.play()}catch(e){toast('Recitation could not be started in this browser')}}
function stopAudio(){let a=document.getElementById('quranAudio');if(a){a.pause();a.currentTime=0}}
function bookmarkVerse(k){let b=JSON.parse(localStorage.getItem('noor-bookmarks')||'[]');if(!b.includes(k))b.push(k);localStorage.setItem('noor-bookmarks',JSON.stringify(b));toast('Bookmark saved on this device')}
function previousSurah(){let n=chapters.findIndex(c=>c.englishName===selectedSurah)+1;if(n>1)readSurah(n-1)}
function nextSurah(){let n=chapters.findIndex(c=>c.englishName===selectedSurah)+1;if(n>0&&n<114)readSurah(n+1)}
function applyPrayerSettings(){let city=document.getElementById('cityInput')?.value.trim(),country=document.getElementById('countryInput')?.value.trim(),method=document.getElementById('methodInput')?.value;if(!city||!country){toast('Enter both city and country');return}API_STORE.city=city;API_STORE.country=country;API_STORE.method=method;localStorage.setItem('noor-city',city);localStorage.setItem('noor-country',country);localStorage.setItem('noor-method',method);syncLocationLabels();toast('Updating prayer times…');loadPrayerData()}
setLocation=function(){go('prayers');toast('Enter your city and country to calculate prayer times; precise location is not needed')}
function renderLivePrayerViews(){if(page==='home'||page==='prayers'||page==='qibla')render()}
const baseRender=render;render=function(){baseRender();syncLocationLabels()}
async function initializeLive(){let cache=localStorage.getItem('noor-prayer-cache');if(cache){try{let c=JSON.parse(cache);if(c.city===API_STORE.city&&c.country===API_STORE.country){livePrayer=c.data;liveQibla=+(localStorage.getItem('noor-qibla')||0)}}catch(_){}}await Promise.allSettled([loadPrayerData(),loadChapters()])}
initializeLive();
</script>




<script>
const primaryTabsFix=[['home','⌂','Home'],['prayers','◷','Prayers'],['quran','▤','Quran'],['ummah','◎','Ummah']];
nav=function(){let tabhtml=primaryTabsFix.map(function(x){return '<button class="'+(page===x[0]?'active':'')+'" onclick="go(&quot;'+x[0]+'&quot;)"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join('');let side=document.getElementById('sideNav'),more=document.getElementById('moreNav'),mob=document.getElementById('mobileNav');if(side)side.innerHTML=tabhtml;if(more)more.innerHTML=[['qibla','◎','Qibla'],['duas','♡','Duas'],['giving','♧','Giving'],['tasbeeh','◉','Tasbeeh'],['inspiration','✧','Inspiration'],['aideen','✦','Ask AiDeen'],['calendar','▦','Calendar'],['settings','⚙','Settings']].map(function(x){return '<button class="'+(page===x[0]?'active':'')+'" onclick="go(&quot;'+x[0]+'&quot;)"><span class="ico">'+x[1]+'</span>'+x[2]+'</button>'}).join('');if(mob)mob.innerHTML=tabhtml};
function currentNext(){let t=livePrayer&&livePrayer.timings;if(!t)return null;let now=new Date();for(let n of ['Fajr','Dhuhr','Asr','Maghrib','Isha']){let v=t[n]&&t[n].split(' ')[0];if(!v)continue;let a=v.split(':').map(Number),d=new Date();d.setHours(a[0],a[1],0,0);if(d>now)return {name:n,time:t[n]}}return {name:'Fajr',time:t.Fajr,tomorrow:true}}

all class="sub" style="display:block;margin-top:4px">Arabic · translation · recitation</small></span><span class="tag">Read →</span></button><div class="sectionhead"><h2>Ummah</h2><button class="plain" onclick="go(&quot;ummah&quot;)">Join the community →</button></div><div class="card soft"><b>Reflections, duas, and reminders</b><p class="sub" style="line-height:1.6;margin:7px 0 0">Connect with the global Ummah.</p></div>'};
ummah=function(){let sample=[{name:'Amina',initial:'A',time:'2 h ago',text:'A small reminder for today: take a breath, make dua, and trust the timing of what is meant for you.',likes:12},{name:'Yusuf',initial:'Y',time:'5 h ago',text:'Alhamdulillah for a quiet morning and a few minutes with the Quran before the day began.',likes:8}],local=JSON.parse(localStorage.getItem('noor-feed')||'[]'),posts=local.concat(sample),likes=JSON.parse(localStorage.getItem('noor-likes')||'{}');return title('Ummah','Reflections, duas, and reminders from the community')+'<button class="primary" style="width:100%;margin-bottom:14px" onclick="composeUmmahPost()">＋ Share a reflection or dua</button><div class="card soft small" style="margin-bottom:12px;line-height:1.6">Community preview: your posts are saved on this device and are not published online.</div><div class="dua-list">'+posts.map(function(p,i){return '<article class="card"><div class="rowbetween"><div><span class="avatar">'+p.initial+'</span> <b>'+p.name+'</b><small class="sub"> · '+p.time+'</small></div><button class="plain" onclick="flash(&quot;Post options&quot;)">•••</button></div><p style="line-height:1.65;margin:13px 0">'+p.text+'</p><div class="postActions"><button onclick="likeUmmah('+i+')">'+(likes[i]?'♥':'♡')+' '+(p.likes+(likes[i]?1:0))+' likes</button><button onclick="flash(&quot;Replies are not connected in this preview&quot;)">▢ Reply</button><button onclick="flash(&quot;Reminder saved&quot;)">↗ Share</button></div></article>'}).join('')+'</div>'};
function composeUmmahPost(){modal('Share with the Ummah','<label class="field">Your reflection<textarea id="postInput" rows="4" maxlength="500" placeholder="Share a thought, reminder, or dua…" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:12px"></textarea></label><button class="primary" style="width:100%;margin-top:12px" onclick="saveUmmahPost()">Save post locally</button><p class="sub">This preview does not publish online.</p>')}
function saveUmmahPost(){let v=document.getElementById('postInput').value.trim();if(!v)return flash('Write a reflection first');let a=JSON.parse(localStorage.getItem('noor-feed')||'[]');a.unshift({name:localStorage.getItem('noor-name')||'Samira',initial:(localStorage.getItem('noor-name')||'S')[0],time:'Just now',text:v,likes:0});localStorage.setItem('noor-feed',JSON.stringify(a));closeModal();render()}

async function searchDeen(){let q=document.getElementById('deenTopic').value.trim(),box=document.getElementById('deenResults');if(!q)return flash('Enter a topic to search');box.innerHTML='<p class="sub">Searching…</p>';try{let x=await getJSON('https://api.alquran.cloud/v1/search/'+encodeURIComponent(q)+'/all/en');box.innerHTML='<div class="sectionhead"><h2>Quran references</h2></div>'+x.matches.slice(0,8).map(function(v){return '<div class="card" style="margin-bottom:9px"><span class="tag">'+v.surah.englishName+' · '+v.numberInSurah+'</span><p style="line-height:1.6;margin:11px 0">'+v.text+'</p></div>'}).join('')}catch(e){box.innerHTML='<p class="sub">No matches returned. Try a shorter topic.</p>'}}

<script>
var readerAudioEdition='ar.alafasy',readerAudioReciter='Mishary Rashid Alafasy',readerSpeed=1,readerRequestToken=0,readerLoading=false;
var readingGoalMinutes=Math.max(5,Number(localStorage.getItem('noor-quran-goal')||5)),readingSeconds=Number(localStorage.getItem('noor-quran-seconds')||0);
function readerEscape(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function readerChapter(){return chapters.find(function(c){return c.englishName===selectedSurah})||chapters[0]||{number:1,englishName:selectedSurah||'Al-Faatiha',englishNameTranslation:'The Opener',numberOfAyahs:7,name:'سُورَةُ الْفَاتِحَةِ'}}
function readerOptions(){var list=chapters.length?chapters:surahs.map(function(n,i){return{number:i+1,englishName:n,englishNameTranslation:i===0?'The Opener':'',name:''}});return list.map(function(c){return '<option value="'+c.number+'" '+(c.englishName===selectedSurah?'selected':'')+'>'+readerEscape(c.englishName)+'</option>'}).join('')}
function readerThemeClass(){var t=localStorage.getItem('noor-quran-theme')||'paper';return t==='night'?'reader-night':t==='white'?'reader-white':''}
function readerTranslationClass(){return localStorage.getItem('noor-quran-translation')==='false'?'reader-translations-hidden':''}
function readerArabicSize(){return Math.max(34,Math.min(58,Number(localStorage.getItem('noor-quran-arabic-size')||48)))}
quranPage=function(){var c=readerChapter(),chapterNo=c.number||1,translation=c.englishNameTranslation||'The Opener',time=Math.floor(readingSeconds/60);return '<section class="quran-reader '+readerThemeClass()+' '+readerTranslationClass()+'" style="--quran-arabic-size:'+readerArabicSize()+'px"><div class="quran-toolbar"><button class="reader-icon" aria-label="Back to Home" onclick="go(\'home\')">←</button><div class="reader-title-group"><select class="reader-surah-select" aria-label="Choose surah" onchange="readSurah(this.value)">'+readerOptions()+'</select><span class="reader-subtitle">'+readerEscape(translation)+' · '+(c.numberOfAyahs||'')+' verses</span></div><button class="reader-icon-button" aria-label="About this reading" onclick="showQuranInfo()">ⓘ</button><button class="reader-icon-button" aria-label="Reading settings" onclick="toggleReaderSettings()">⚙</button></div><div class="reader-settings" id="readerSettings" hidden><label class="reader-setting"><span>Arabic text size</span><input type="range" min="34" max="58" value="'+readerArabicSize()+'" oninput="setQuranArabicSize(this.value)"></label><label class="reader-setting"><span>Theme</span><select onchange="setQuranTheme(this.value)"><option value="paper" '+(readerThemeClass()===''?'selected':'')+'>Warm parchment</option><option value="white" '+(readerThemeClass()==='reader-white'?'selected':'')+'>White</option><option value="night" '+(readerThemeClass()==='reader-night'?'selected':'')+'>Night</option></select></label><label class="reader-setting"><span>Show transliteration & meaning</span><input type="checkbox" '+(readerTranslationClass()===''?'checked':'')+' onchange="setQuranTranslation(this.checked)"></label></div><div class="reading-goal"><strong>'+chapterNo+'. '+readerEscape(translation)+'</strong><button class="goal-control" onclick="cycleReadingGoal()">Reading goal: <span id="readingGoalValue">'+Math.min(readingGoalMinutes,time)+'/'+readingGoalMinutes+' mins</span><i class="goal-ring"></i><span aria-hidden="true">›</span></button></div><div class="surah-banner"><span class="banner-flourish">❀ ✧ ❀</span><span class="banner-name" lang="ar">'+readerEscape(c.name||'سُورَةُ الْفَاتِحَةِ')+'</span><span class="banner-flourish">❀ ✧ ❀</span></div><div class="reader-loadstatus" id="loadStatus">'+(readerLoading?'Loading Arabic, transliteration, and English meaning…':(currentVerses.length?'All '+currentVerses.length+' ayahs · Arabic, transliteration, and English meaning':'Choose a surah to begin reading.'))+'</div><div class="ayah-list" id="readingArea">'+(currentVerses.length?verseMarkup():'<div class="reader-empty">Arabic, transliteration, and English meaning will appear here.<br>Select a surah from the title above.</div>')+'</div><details class="surah-catalog"><summary>Browse all 114 surahs</summary><div class="surah-catalog-body"><input class="search" id="surahSearch" placeholder="⌕   Search all surahs" oninput="document.getElementById(\'surahList\').innerHTML=apiSurahList(this.value)"><div class="card quran-list" id="surahList">'+apiSurahList()+'</div></div></details><div class="quran-audio-bar" role="region" aria-label="Full surah audio player"><button class="audio-play" id="audioPlayButton" aria-label="Play full surah" onclick="toggleSurahAudio()">▶</button><div class="audio-meta"><span class="audio-title" id="audioTitle">'+readerEscape(c.englishName)+' · Full surah</span><span class="audio-reciter" id="audioReciter">'+readerAudioReciter+'</span><div class="audio-progress-row"><input class="audio-seek" id="audioSeek" aria-label="Audio position" type="range" min="0" max="100" value="0" oninput="seekSurahAudio(this.value)"><span class="audio-time" id="audioTime">0:00 / --:--</span></div></div><button class="audio-speed" id="audioSpeed" onclick="cycleReaderSpeed()" aria-label="Playback speed">1×</button><button class="audio-skip" aria-label="Previous surah" onclick="changeReaderSurah(-1,true)">|◂</button><button class="audio-skip" aria-label="Next surah" onclick="changeReaderSurah(1,true)">▸|</button><audio id="quranAudio" class="quran-audio-element" preload="metadata" ontimeupdate="updateQuranAudio()" onplay="updateReaderPlayState()" onpause="updateReaderPlayState()" onended="updateReaderPlayState()" onerror="quranAudioError()"></audio></div></section>'}
verseMarkup=function(){var chapter=readerChapter().number||1;return currentVerses.map(function(v){return '<article class="ayah-block"><div class="ayah-tools"><button class="ayah-marker" onclick="bookmarkVerse(\''+readerEscape(v.number)+'\')">Ayah '+chapter+':'+v.numberInSurah+' <span>⌄</span></button></div><div class="ayah-arabic-row"><div class="ayah-rosette"><span>'+v.numberInSurah+'</span></div><div class="arabic" lang="ar">'+readerEscape(v.text)+'</div></div>'+(v.transliteration?'<div class="ayah-transliteration" lang="en">'+readerEscape(v.transliteration)+'</div>':'')+'<div class="ayah-translation" lang="en">'+readerEscape(v.translation||'')+'</div><div class="ayah-bookmark"><button onclick="bookmarkVerse(\''+readerEscape(v.number)+'\')">♡ Save ayah</button></div></article>'}).join('')}
async function readSurah(n){n=Number(n)||1;var chapter=chapters[n-1];if(!chapter){toast('Surah list is still loading');return}var token=++readerRequestToken;stopAudio();selectedSurah=chapter.englishName;localStorage.setItem('noor-surah',selectedSurah);localStorage.setItem('noor-surah-number',n);currentVerses=[];readerLoading=true;render();var status=document.getElementById('loadStatus');if(status)status.textContent='Loading Arabic, transliteration, and English meaning…';try{var base='https://api.alquran.cloud/v1/surah/'+n+'/editions/';var result=await Promise.all([getJSON(base+'quran-uthmani,en.sahih'),getJSON(base+'en.transliteration').catch(function(){return null})]);if(token!==readerRequestToken)return;var main=result[0].data,transResult=result[1]&&result[1].data,arabic=main.find(function(x){return x.edition.identifier==='quran-uthmani'}),english=main.find(function(x){return x.edition.identifier==='en.sahih'}),trans=transResult&&(transResult.find(function(x){return x.edition&&x.edition.identifier==='en.transliteration'})||transResult[0]);currentVerses=arabic.ayahs.map(function(v,i){return{number:v.number,numberInSurah:v.numberInSurah,text:v.text,translation:english.ayahs[i]&&english.ayahs[i].text,transliteration:trans&&trans.ayahs[i]&&trans.ayahs[i].text||'',surah:arabic.englishName}});readerLoading=false;render();localStorage.setItem('noor-last-verse',n+':1')}catch(e){if(token!==readerRequestToken)return;readerLoading=false;render();var statusError=document.getElementById('loadStatus');if(statusError)statusError.textContent='Unable to load Quran text. Check your connection and try again.';toast('Quran content could not load')}}
function ensureReaderChapter(){if(page!=='quran'||currentVerses.length)return;var number=(chapters.find(function(c){return c.englishName===selectedSurah})||{}).number||Number(localStorage.getItem('noor-surah-number'))||1;if(chapters.length){readSurah(number);return}var token=readerRequestToken;var attempts=0;function retry(){if(page!=='quran'||currentVerses.length||readerRequestToken!==token)return;if(chapters.length){var match=chapters.find(function(c){return c.englishName===selectedSurah});readSurah(match?match.number:number);return}if(++attempts<40)setTimeout(retry,250)}retry()}
var goBeforeQuranReader=go;go=function(target){if(target!=='quran')stopAudio();goBeforeQuranReader(target);if(target==='quran')ensureReaderChapter()};
function showQuranInfo(){toast('Each ayah includes Arabic, transliteration, and the Saheeh International English meaning')}
function toggleReaderSettings(){var panel=document.getElementById('readerSettings');if(panel)panel.hidden=!panel.hidden}
function setQuranArabicSize(value){var size=Math.max(34,Math.min(58,Number(value)||48)),root=document.querySelector('.quran-reader');if(root)root.style.setProperty('--quran-arabic-size',size+'px');localStorage.setItem('noor-quran-arabic-size',size)}
function setQuranTheme(theme){localStorage.setItem('noor-quran-theme',theme);var root=document.querySelector('.quran-reader');if(root){root.classList.remove('reader-night','reader-white');if(theme==='night')root.classList.add('reader-night');if(theme==='white')root.classList.add('reader-white')}}
function setQuranTranslation(visible){localStorage.setItem('noor-quran-translation',String(!!visible));var root=document.querySelector('.quran-reader');if(root)root.classList.toggle('reader-translations-hidden',!visible)}
function cycleReadingGoal(){readingGoalMinutes=readingGoalMinutes===5?10:readingGoalMinutes===10?15:5;localStorage.setItem('noor-quran-goal',readingGoalMinutes);updateReadingGoal()}
function updateReadingGoal(){var e=document.getElementById('readingGoalValue');if(e)e.textContent=Math.min(readingGoalMinutes,Math.floor(readingSeconds/60))+'/'+readingGoalMinutes+' mins'}
setInterval(function(){if(page==='quran'){readingSeconds++;if(readingSeconds%15===0)localStorage.setItem('noor-quran-seconds',readingSeconds);updateReadingGoal()}},1000);
function readerAudio(){return document.getElementById('quranAudio')}
function playChapter(){var a=readerAudio(),c=readerChapter();if(!a||!chapters.length){toast('Surah audio is loading');return}var n=c.number||1;if(a.dataset.surah===String(n)&&a.src){a.play().then(updateReaderPlayState).catch(function(){toast('Audio playback could not start')});return}a.pause();a.dataset.surah=String(n);a.src='https://cdn.islamic.network/quran/audio-surah/128/'+readerAudioEdition+'/'+n+'.mp3';a.playbackRate=readerSpeed;var title=document.getElementById('audioTitle');if(title)title.textContent=c.englishName+' · Full surah';var who=document.getElementById('audioReciter');if(who)who.textContent=readerAudioReciter;a.load();a.play().then(updateReaderPlayState).catch(function(){toast('Surah audio could not start. Check your connection.')})}
function toggleSurahAudio(){var a=readerAudio();if(a&&a.src&&!a.paused){a.pause();return}playChapter()}
function stopAudio(){var a=readerAudio();if(a){a.pause();try{a.currentTime=0}catch(_){}}updateReaderPlayState()}
function updateReaderPlayState(){var a=readerAudio(),b=document.getElementById('audioPlayButton');if(b){b.textContent=a&&!a.paused?'Ⅱ':'▶';b.setAttribute('aria-label',a&&!a.paused?'Pause full surah':'Play full surah')}}
function formatReaderTime(s){if(!isFinite(s)||s<0)return'--:--';var m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+String(sec).padStart(2,'0')}
function updateQuranAudio(){var a=readerAudio(),seek=document.getElementById('audioSeek'),time=document.getElementById('audioTime');if(!a)return;if(seek&&isFinite(a.duration)&&a.duration>0){seek.max=Math.floor(a.duration);seek.value=Math.floor(a.currentTime)}if(time)time.textContent=formatReaderTime(a.currentTime)+' / '+formatReaderTime(a.duration);updateReaderPlayState()}
function seekSurahAudio(value){var a=readerAudio();if(a&&isFinite(a.duration))a.currentTime=Number(value)}
function cycleReaderSpeed(){var values=[1,1.25,1.5,.75],index=values.indexOf(readerSpeed);readerSpeed=values[(index+1)%values.length];var a=readerAudio(),b=document.getElementById('audioSpeed');if(a)a.playbackRate=readerSpeed;if(b)b.textContent=readerSpeed+'×'}
function changeReaderSurah(step,autoplay){var n=(readerChapter().number||1)+step;if(n<1)n=114;if(n>114)n=1;readSurah(n).then(function(){if(autoplay)playChapter()})}
function quranAudioError(){toast('This recitation is temporarily unavailable')}
var existingQuranRender=render;render=function(){existingQuranRender();if(page==='quran'){var a=readerAudio();if(a)a.playbackRate=readerSpeed;updateReaderPlayState();updateQuranAudio()}};
render();
</script>

<!-- NOOR QURAN HUB V3 START -->
<script>
var quranReaderPageV2=quranPage,quranView='library',quranLibraryTab='read',quranSearchVisible=false;
function quranRecentEntries(){try{var a=JSON.parse(localStorage.getItem('noor-quran-recents')||'[]');if(a.length)return a.slice(0,6)}catch(_){}var last=localStorage.getItem('noor-last-verse')||'1:1';return[{number:Number(localStorage.getItem('noor-surah-number')||1),verse:Number(last.split(':')[1]||1),at:Date.now()}]}
function saveQuranRecent(n,verse){var a=quranRecentEntries().filter(function(x){return Number(x.number)!==Number(n)});a.unshift({number:Number(n),verse:Number(verse||1),at:Date.now()});localStorage.setItem('noor-quran-recents',JSON.stringify(a.slice(0,6)))}
function quranLibraryList(filter){var list=chapters.length?chapters:surahs.map(function(name,i){return{number:i+1,englishName:name,englishNameTranslation:i===0?'The Opener':'',name:''}}),q=String(filter||'').toLowerCase();return list.filter(function(c){return(c.englishName+' '+c.englishNameTranslation+' '+c.name).toLowerCase().includes(q)}).map(function(c){return '<button class="library-surah-row" onclick="openSurah('+c.number+')"><span class="library-surah-number">'+c.number+'</span><span class="library-surah-arabic" lang="ar">'+readerEscape(c.name||'سُورَة')+'</span><span class="library-surah-label"><strong>'+readerEscape(c.englishName)+'</strong><small>'+readerEscape(c.englishNameTranslation||'Surah')+'</small></span></button>'}).join('')}
function quranRecentCards(){return quranRecentEntries().slice(0,4).map(function(x){var c=chapters[Number(x.number)-1]||{number:x.number,englishName:selectedSurah||'Al-Faatiha',name:'سُورَةُ الْفَاتِحَةِ'};return '<button class="recent-card" onclick="openSurah('+c.number+')"><span class="recent-arabic-box" lang="ar">'+readerEscape(c.name||'سُورَة')+'</span><strong>'+readerEscape(c.englishName)+'</strong><small>Aya '+Number(x.verse||1)+'</small><em>Continue reading</em></button>'}).join('')}
function quranLibraryPage(){var c=chapters.find(function(x){return x.englishName===selectedSurah})||chapters[0]||{number:1,englishName:'Al-Faatiha'};var readContent='<div class="library-promo"><div class="library-promo-copy"><small>READ & REFLECT</small><h2>Complete Quran</h2><p>Arabic, transliteration, meaning and recitation</p></div><button class="library-promo-button" onclick="openSurah('+(c.number||1)+')">Continue reading →</button></div><section class="library-section"><div class="library-section-heading"><h2>Recents</h2><button class="library-info" aria-label="About recents" onclick="toast(\'Your recent Quran readings are saved on this device\')">i</button></div><div class="recent-list">'+quranRecentCards()+'</div></section><div class="library-list-heading"><h2>Sura list</h2><span class="library-view-button">View: Sura　⌄</span></div>'+(quranSearchVisible?'<input class="library-search" id="quranLibrarySearch" placeholder="Search surahs" oninput="filterQuranLibrary(this.value)">':'')+'<div class="library-surah-list" id="quranSurahList">'+quranLibraryList('')+'</div>';
var learnContent='<div class="library-learning"><article class="library-learning-card"><h3>Start with the Arabic letters</h3><p>Build confidence with short, guided lessons and clear pronunciation examples.</p></article><article class="library-learning-card"><h3>Practice a short surah</h3><p>Read Al-Faatiha one ayah at a time with transliteration and meaning.</p><button class="library-promo-button" style="margin-top:14px" onclick="openSurah(1)">Practice Al-Faatiha →</button></article></div>';
var rec=quranRecentEntries(),learned=new Set(rec.map(function(x){return Number(x.number)})).size,progressContent='<div class="library-progress"><div class="library-stat-row"><div class="library-stat"><strong>'+learned+' / 114</strong><small>Surahs opened</small></div><div class="library-stat"><strong>'+JSON.parse(localStorage.getItem('noor-bookmarks')||'[]').length+'</strong><small>Saved ayahs</small></div></div><article class="library-progress-card"><h3>Keep your reading rhythm</h3><p>Your recent surah and ayah are saved on this device, so you can continue where you left off.</p></article><button class="library-promo-button" onclick="setQuranLibraryTab(\'read\')">Back to Read →</button></div>';
var panel=quranLibraryTab==='learn'?learnContent:quranLibraryTab==='progress'?progressContent:readContent;return '<section class="quran-library"><header class="library-header"><button class="library-back" aria-label="Back to Home" onclick="go(\'home\')">←</button><h1>Quran</h1><button class="library-action" aria-label="My Progress" onclick="setQuranLibraryTab(\'progress\')">▮</button><button class="library-action" aria-label="Search surahs" onclick="toggleQuranSearch()">⌕</button></header><nav class="library-tabs" aria-label="Quran sections"><button class="'+(quranLibraryTab==='read'?'active':'')+'" onclick="setQuranLibraryTab(\'read\')">Read</button><button class="'+(quranLibraryTab==='learn'?'active':'')+'" onclick="setQuranLibraryTab(\'learn\')">Learn</button><button class="'+(quranLibraryTab==='progress'?'active':'')+'" onclick="setQuranLibraryTab(\'progress\')">My Progress</button></nav><div class="library-content">'+panel+'</div></section>'}
quranPage=function(){return quranView==='reader'?quranReaderPageV2():quranLibraryPage()};
function setQuranLibraryTab(tab){quranLibraryTab=tab;render()}
function toggleQuranSearch(){quranSearchVisible=!quranSearchVisible;render();if(quranSearchVisible){var input=document.getElementById('quranLibrarySearch');if(input)input.focus()}}
function filterQuranLibrary(value){var list=document.getElementById('quranSurahList');if(list)list.innerHTML=quranLibraryList(value)}
function openSurah(n){quranView='reader';readerLoading=true;readSurah(n)}
function returnToQuranLibrary(){quranView='library';readerLoading=false;stopAudio();render()}
var readSurahBeforeHub=readSurah;readSurah=async function(n){await readSurahBeforeHub(n);if(currentVerses.length)saveQuranRecent(n,1)};
var goBeforeQuranHub=goBeforeQuranReader;go=function(target){if(target==='quran'){quranView='library';quranSearchVisible=false;stopAudio()}else stopAudio();goBeforeQuranHub(target)};
/* Keep the reader's back control within the Quran section. */
var oldReaderPage=quranReaderPageV2;quranReaderPageV2=function(){return oldReaderPage().replace('onclick="go(\\\'home\\\')"','onclick="returnToQuranLibrary()"')};
render();
</script>

<script>
var readerMarkupBeforeHubFix=quranReaderPageV2;quranReaderPageV2=function(){return readerMarkupBeforeHubFix().replace(`aria-label="Back to Home" onclick="go('home')"`,`aria-label="Back to Surah list" onclick="returnToQuranLibrary()"`)};

openSurah=function(n){quranView='reader';readerLoading=true;readSurah(n);window.scrollTo(0,0)};
