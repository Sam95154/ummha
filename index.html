<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022C22">
  <meta name="description" content="Noor-ul-Islam — an Islamic companion prototype with Quran-reader layout, Tasbih and local dataset validation.">
  <title>Noor-ul-Islam — نور الإسلام</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600&family=Noto+Nastaliq+Urdu&display=swap">
  <link rel="stylesheet" href="noor/styles.css">
</head>
<body>
  <header><div class="top">
    <a class="logo" href="#/home">نور الإسلام <small style="font-family:Inter;font-size:.8rem">Noor-ul-Islam</small></a>
    <nav id="nav" aria-label="Main"></nav>
    <input id="gs" class="c" type="search" placeholder="Search…" aria-label="Search" style="width:130px">
    <select id="lang" class="c" aria-label="Language"><option value="en">English</option><option value="ur">اردو</option><option value="ar">العربية</option></select>
    <button class="c" data-act="theme" aria-label="Theme">◐</button>
    <button class="c" data-act="rm" aria-label="Reduce motion">✦</button>
  </div></header>
  <main id="view"></main>
  <nav class="bn" id="bn" aria-label="Bottom"></nav>
  <script src="noor/src/data.js"></script>
  <script src="noor/src/app.js"></script>
  <script src="noor/src/dataset-tools.js"></script>
</body>
</html>
