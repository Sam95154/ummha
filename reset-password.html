<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reset password · MOMIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#f3efe5;--card:#fdfbf6;--field:#f6f1e4;--ink:#1b1710;--muted:#7a7466;--line:#e6dfcc;--gold:#a97a22;--teal:#0b4f47;--err:#b3402f;--serif:"Playfair Display",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0d120f;--card:#151c18;--field:#1b2420;--ink:#f1ecdf;--muted:#9aa196;--line:#25302a;--gold:#d9aa52;--teal:#0f5b52;--err:#ef8a78}}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(100% 55% at 50% 0%,#513c1e 0%,transparent 70%),var(--bg);font:16px/1.5 var(--sans);color:var(--ink)}
.card{width:min(100%,450px);padding:30px;border:1px solid var(--line);border-radius:26px;background:var(--card);box-shadow:0 24px 70px #0003}
.logo{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#f0d38f,#bb8b35);color:#19140b;font-size:25px;margin-bottom:18px}
.kicker{font-size:11px;letter-spacing:.17em;font-weight:800;text-transform:uppercase;color:var(--gold)}
h1{font:600 30px/1.2 var(--serif);margin:6px 0 8px}p{color:var(--muted);margin:0 0 20px}
label{display:grid;gap:7px;margin-top:14px;font-size:13px;font-weight:650}
input{width:100%;height:52px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--field);color:var(--ink);font:inherit}
input.code{font-size:25px;font-weight:800;letter-spacing:.35em;text-align:center}
button{width:100%;height:54px;margin-top:20px;border:0;border-radius:99px;background:linear-gradient(135deg,#157064,var(--teal));color:#fff0cf;font:700 15px var(--sans);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.msg{display:none;margin-top:15px;padding:12px;border-radius:12px;font-size:13px;overflow-wrap:anywhere}.msg.show{display:block}.msg.error{color:var(--err);background:#b3402f12;border:1px solid #b3402f44}.msg.success{color:var(--teal);background:#0b4f4712;border:1px solid #0b4f4744}
a{display:block;text-align:center;margin-top:18px;color:var(--gold);font-size:13px;text-decoration:none;font-weight:700}
.hint{font-size:12px;margin-top:8px;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
<div class="logo">م</div><span class="kicker">MOMIN · ACCOUNT SECURITY</span>
<h1>Reset your password</h1>
<p>Enter the eight-digit code from your MOMIN password-reset email, then choose a new password. You do not need to open the email link.</p>
<form id="resetForm">
<label>Email address<input id="email" type="email" autocomplete="email" required></label>
<label>Eight-digit email code<input id="token" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]{8}" placeholder="00000000" required></label>
<div class="hint">Use the newest code. Each code can only be used once.</div>
<label>New password<input id="password" type="password" autocomplete="new-password" minlength="8" required></label>
<label>Confirm new password<input id="confirm" type="password" autocomplete="new-password" minlength="8" required></label>
<button id="submit" type="submit">Verify code & update password</button>
</form>
<div id="message" class="msg" role="status" aria-live="polite"></div>
<a href="/login.html">Back to sign in</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const SUPABASE_URL="https://qzwqpiquvhpjwqgaxorp.supabase.co";
const SUPABASE_KEY="sb_publishable_SAHjdts8xtuQSXE_lPa1cw_V6J3PjQt";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
 auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,flowType:"pkce"}
});
const form=document.getElementById("resetForm");
const button=document.getElementById("submit");
const message=document.getElementById("message");
const emailInput=document.getElementById("email");
const tokenInput=document.getElementById("token");
emailInput.value=new URLSearchParams(location.search).get("email")||"";
function show(text,type){message.textContent=text;message.className="msg show "+type;}
tokenInput.addEventListener("input",function(){this.value=this.value.replace(/[^0-9]/g,"").slice(0,8);});
form.addEventListener("submit",async function(event){
 event.preventDefault();
 const email=emailInput.value.trim().toLowerCase();
 const token=tokenInput.value.trim();
 const password=document.getElementById("password").value;
 const confirm=document.getElementById("confirm").value;
 if(!email){show("Enter the email address for your MOMIN account.","error");return;}
 if(!/^[0-9]{8}$/.test(token)){show("Enter the eight-digit code from your latest email.","error");return;}
 if(password.length<8){show("Use at least 8 characters for your new password.","error");return;}
 if(password!==confirm){show("The passwords do not match.","error");return;}
 button.disabled=true;
 button.textContent="Verifying code…";
 try{
  const verified=await client.auth.verifyOtp({email:email,token:token,type:"recovery"});
  if(verified.error)throw verified.error;
  if(!verified.data||!verified.data.session)throw new Error("The recovery code could not be verified. Request a new code and try again.");
  button.textContent="Updating password…";
  const updated=await client.auth.updateUser({password:password});
  if(updated.error)throw updated.error;
  show("Your password has been updated. You can now sign in with your new password.","success");
  form.reset();
  await client.auth.signOut({scope:"local"});
  setTimeout(function(){location.assign("/login.html");},1800);
 }catch(error){
  show(error&&error.message?error.message:"Could not verify the code or update your password. Request a fresh code if it has expired.","error");
 }finally{
  button.disabled=false;
  button.textContent="Verify code & update password";
 }
});
</script>
</body>
</html>
