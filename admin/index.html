<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>MOMIN Admin · In Development</title>
<style>
:root{color-scheme:dark;--bg:#11100d;--panel:#1b1914;--gold:#c6a15d;--ink:#f5f0e5;--muted:#aaa294}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#3a2c16 0%,transparent 56%),var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(100%,480px);padding:38px 28px;text-align:center;border:1px solid #5c4827;border-radius:24px;background:linear-gradient(160deg,#211d15,var(--panel));box-shadow:0 24px 80px #0008}
img{width:68px;height:68px;object-fit:contain;margin-bottom:18px}
h1{margin:0 0 10px;font:600 30px/1.2 Georgia,serif}
p{margin:0;color:var(--muted)}
a{display:inline-flex;margin-top:26px;padding:11px 18px;border:1px solid #8d713d;border-radius:12px;color:#f0d69f;text-decoration:none}
</style>
</head>
<body><main>
<img src="/momin-mark.svg?v=islamic-logo-v3" alt="MOMIN">
