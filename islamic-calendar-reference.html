<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Islamic calendar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;700&display=swap">
<style>
:root{--bg:#f3f1e8;--surface:#fff;--ink:#0d2b24;--muted:#51675f;--line:#d6dccf;--accent:#0a8f62;--accent-ink:#fff;--gold:#a8750f;--glow:rgba(10,143,98,.18);--nav:rgba(255,255,255,.88);--cell:#f6f7f1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06241d;--surface:#0b3a2f;--ink:#eef6f0;--muted:#9bb8ad;--line:#1d5445;--accent:#12c887;--accent-ink:#04261c;--gold:#e8b94a;--glow:rgba(18,200,135,.22);--nav:rgba(6,36,29,.9);--cell:#0e4538}}
:root[data-theme="dark"]{--bg:#06241d;--surface:#0b3a2f;--ink:#eef6f0;--muted:#9bb8ad;--line:#1d5445;--accent:#12c887;--accent-ink:#04261c;--gold:#e8b94a;--glow:rgba(18,200,135,.22);--nav:rgba(6,36,29,.9);--cell:#0e4538}
*{box-sizing:border-box;margin:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 Manrope,system-ui,sans-serif;padding-bottom:100px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px}
.badge{width:40px;height:40px;border-radius:12px;background:#f6f1e3;display:grid;place-items:center;padding:5px;box-shadow:0 4px 14px var(--glow)}
.badge svg{width:100%;height:auto}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--accent)}70%,100%{box-shadow:0 0 0 9px transparent}}
h1{font-size:34px;line-height:1.1;margin-top:6px}
.sub{color:var(--muted);font-size:14px;margin-top:6px}

.next{position:relative;display:flex;gap:18px;align-items:center;margin-top:22px;padding:20px;border-radius:30px;border:1px solid var(--line);overflow:hidden;background:radial-gradient(110% 120% at 0% 0%,var(--glow),transparent 65%),var(--surface)}
.ringbox{position:relative;flex:none;width:112px;height:112px}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-width:7;stroke-linecap:round}
.rt{stroke:var(--line)}.rp{stroke:var(--gold);stroke-dasharray:314;stroke-dashoffset:314;transition:stroke-dashoffset 1.8s .3s cubic-bezier(.2,.7,.2,1)}
.rn{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rn b{font:700 34px/1 Fraunces,Georgia,serif;font-variant-numeric:tabular-nums}
.rn span{font-size:12px;color:var(--muted)}
.next h2{font-size:22px;line-height:1.2}
.next p{font-size:13px;color:var(--muted);margin-top:4px}

.cal{margin-top:16px;border-radius:30px;background:var(--surface);border:1px solid var(--line);padding:20px 14px 16px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px}
.chead h2{font-size:24px;line-height:1.1}
.chead small{display:block;color:var(--gold);font-size:13px;font-weight:700;margin-top:3px}
.ctrl{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;transition:background .2s,transform .15s}
.ib:hover{background:var(--cell)}.ib:active{transform:scale(.9)}
.today-btn{width:auto;padding:0 14px;border-radius:99px;font-size:13px;font-weight:700}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow{margin-top:16px}
.dow span{text-align:center;font-size:12px;color:var(--muted);padding:6px 0}
.dow span:last-child{color:var(--accent)}
.grid{gap:3px;margin-top:2px}
.grid.go{animation:slide .45s cubic-bezier(.2,.7,.2,1)}
.grid.back{--dx:-26px}
@keyframes slide{from{opacity:0;transform:translateX(var(--dx,26px))}}
.c{position:relative;aspect-ratio:1/1.12;border:0;border-radius:16px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:background .2s,transform .2s;animation:pop .4s calc(var(--i)*9ms) both}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
.c:hover{background:var(--cell)}
.c .g{font-size:17px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.c .h{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.c.fri .g{color:var(--accent)}
.c.ev::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.c.ev.eid::after{width:16px;height:4px;border-radius:3px}
.c.sel{background:var(--cell);box-shadow:inset 0 0 0 1.5px var(--ink)}
.c.now{background:var(--accent);color:var(--accent-ink)}
.c.now .h,.c.now .g{color:var(--accent-ink)}
.c.now::before{content:"";position:absolute;inset:0;border-radius:16px;border:2px solid var(--accent);animation:halo 2.4s infinite}
@keyframes halo{to{transform:scale(1.35);opacity:0}}
.detail{margin:12px 6px 0;padding:14px 16px;border-radius:20px;background:var(--cell);animation:pop .35s both}
.detail b{font-family:Fraunces,Georgia,serif;font-size:18px;display:block}
.detail .hj{font-size:13px;color:var(--muted)}
.detail .tag{display:inline-flex;gap:8px;align-items:center;margin-top:8px;font-weight:700;color:var(--gold);font-size:14px}
.detail .tag i{width:8px;height:8px;border-radius:50%;background:var(--gold)}

.sec{margin-top:28px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.sec h2{font-size:24px}
.tabs{display:flex;gap:6px}
.tabs button{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:500;transition:.2s}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{margin-top:14px;display:grid;gap:10px}
.it{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);animation:pop .45s calc(var(--i)*45ms) both;transition:transform .2s,border-color .2s}
.it:hover{border-color:var(--accent)}.it:active{transform:scale(.98)}
.it.past{opacity:.55}
.db{flex:none;width:54px;height:58px;border-radius:16px;background:var(--cell);display:grid;place-content:center;text-align:center;line-height:1.1}
.db b{font:700 21px Fraunces,Georgia,serif}.db span{font-size:11px;color:var(--muted)}
.it.eid .db{background:var(--gold);color:#1b1305}.it.eid .db span{color:#1b1305}
.it .m{flex:1;min-width:0}
.it .m b{display:block;font-size:15px}
.it .m span{display:block;font-size:12.5px;color:var(--muted)}
.when{flex:none;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--cell);color:var(--ink)}
.when.soon{background:var(--accent);color:var(--accent-ink)}
.note{margin-top:22px;padding:16px 18px;border-radius:22px;border:1px dashed var(--line);color:var(--muted);font-size:13.5px}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:5}
nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);text-decoration:none;padding:4px 14px}
nav a[aria-current]{color:var(--ink);font-weight:700}nav a[aria-current] svg{color:var(--accent)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.reveal{animation:rise .8s both cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rp{stroke-dashoffset:var(--off)!important}}
</style>

<style id="momin-black-gold-calendar-theme-v1">
/* Match the standalone calendar to MOMIN's black-and-gold theme without changing its layout or logo. */
:root[data-theme="light"]{
 color-scheme:light;--bg:#f5f1e7;--surface:#fffdf8;--ink:#211d17;--muted:#71695b;--line:#e4dac5;
 --accent:#a87b2e;--accent-ink:#18130b;--gold:#b58a39;--glow:rgba(181,138,57,.18);
 --nav:rgba(255,253,248,.94);--cell:#f1e4c4
}
:root[data-theme="dark"]{
 color-scheme:dark;--bg:#0d0c0a;--surface:#191713;--ink:#f5eddb;--muted:#b5a78e;--line:#3d3426;
 --accent:#e1bd67;--accent-ink:#191309;--gold:#dfbd6c;--glow:rgba(223,189,108,.22);
 --nav:rgba(13,12,10,.94);--cell:#2b2418
}
:root[data-theme="sepia"]{
 color-scheme:light;--bg:#eee4cf;--surface:#fff7e6;--ink:#33291c;--muted:#7c6f5a;--line:#dac9a9;
 --accent:#9c7029;--accent-ink:#fffaf0;--gold:#ad8031;--glow:rgba(173,128,49,.18);
 --nav:rgba(255,247,230,.94);--cell:#ead8b1
}
body{background:var(--bg)!important;color:var(--ink)!important;transition:background-color .22s ease,color .22s ease}
.next{background:radial-gradient(110% 120% at 0% 0%,var(--glow),transparent 65%),var(--surface)!important}
.rp{stroke:var(--gold)!important}
.c.fri .g{color:var(--accent)!important}
.c.now{background:linear-gradient(135deg,#e7cd8d 0%,#c49a4a 52%,#9b702d 100%)!important;color:#201608!important}
.c.now .h,.c.now .g{color:#201608!important}
.c.now::before{border-color:var(--accent)!important}
.c.sel{box-shadow:inset 0 0 0 1.5px var(--accent)!important}
.detail{background:var(--cell)!important}
.detail .tag{color:var(--gold)!important}
.it.eid .db{background:linear-gradient(135deg,#e7cd8d,#c49a4a)!important;color:#201608!important}
.it.eid .db span{color:#201608!important}
.when.soon{background:var(--accent)!important;color:var(--accent-ink)!important}
.tabs button[aria-pressed="true"]{background:var(--accent)!important;color:var(--accent-ink)!important;border-color:var(--accent)!important}
.ib:hover{background:var(--cell)!important;border-color:var(--gold)!important}
nav{background:var(--nav)!important;border-color:var(--line)!important}
nav a[aria-current]{color:var(--ink)!important}
nav a[aria-current] svg{color:var(--accent)!important}
</style>
<script id="momin-black-gold-calendar-theme-controller-v1">
(function(){
  "use strict";
  function applyMominCalendarTheme(value){
    var theme=String(value||"Dark").toLowerCase();
    if(["light","dark","sepia"].indexOf(theme)<0)theme="dark";
    document.documentElement.setAttribute("data-theme",theme);
  }
  var saved="Dark";
  try{saved=localStorage.getItem("noor-theme")||"Dark"}catch(_){}
  applyMominCalendarTheme(saved);
  window.addEventListener("storage",function(event){
    if(event.key==="noor-theme")applyMominCalendarTheme(event.newValue||"Dark");
    if(event.key==="noor-hijri-adjustment"&&window.MominCalendarSettingsV1)window.MominCalendarSettingsV1.setHijriAdjustment(event.newValue);
  });
})();
</script>

<script>
var HN=["Muḥarram","Ṣafar","Rabīʿ al-awwal","Rabīʿ al-thānī","Jumādá al-ūlá","Jumādá al-ākhirah","Rajab","Shaʿbān","Ramaḍān","Shawwāl","Dhū al-Qaʿdah","Dhū al-Ḥijjah"];
var RULES=[[1,1,"Islamic New Year","Start of the Hijri year","new"],[1,10,"Day of Ashura","Recommended day of fasting","fast"],[3,12,"Mawlid al-Nabi","Birth of the Prophet ﷺ, observed by many","night"],[7,27,"Isra and Miʿraj","The Night Journey","night"],[8,15,"Mid-Shaʿbān","Night of Barāʾah","night"],[9,1,"Ramadan begins","First day of fasting","fast"],[9,27,"Laylat al-Qadr","Commonly sought on the 27th night","night"],[10,1,"Eid al-Fitr","Festival of breaking the fast","eid"],[12,9,"Day of Arafah","Recommended fast for those not on Hajj","fast"],[12,10,"Eid al-Adha","Festival of sacrifice","eid"]];
var hijriAdjustment=0;try{var savedHijriAdjustment=Number(localStorage.getItem("noor-hijri-adjustment")||"0");if(savedHijriAdjustment===-1||savedHijriAdjustment===0||savedHijriAdjustment===1)hijriAdjustment=savedHijriAdjustment}catch(_){}
var F=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"numeric",year:"numeric"});
function hij(d){var shifted=new Date(+d);shifted.setDate(shifted.getDate()+hijriAdjustment);var p={};F.formatToParts(shifted).forEach(function(x){p[x.type]=x.value});return{d:+p.day,m:+p.month,y:parseInt(p.year||p.relatedYear)}}
function D(y,m,d){return new Date(y,m,d,12)}
function key(d){return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()}
function hs(h){return h.d+" "+HN[h.m-1]+" "+h.y+" AH"}
function G(d,o){return d.toLocaleDateString("en-GB",o)}
var now=new Date(),T=D(now.getFullYear(),now.getMonth(),now.getDate());
var EV={},LIST=[];
function rebuildHijriEvents(){EV={};LIST=[];for(var d=D(2026,0,1);d<=D(2028,11,31);d=D(d.getFullYear(),d.getMonth(),d.getDate()+1)){var h=hij(d);RULES.forEach(function(r){if(r[0]===h.m&&r[1]===h.d){var e={date:d,h:h,n:r[2],t:r[3],k:r[4]};EV[key(d)]=e;LIST.push(e)}})}}
rebuildHijriEvents();
var $=function(i){return document.getElementById(i)};
var view={y:T.getFullYear(),m:T.getMonth()},sel=T,hy=hij(T).y;
var diff=function(a,b){return Math.round((a-b)/864e5)};

$("todayH").textContent=hs(hij(T));

function countUp(el,to){var s=null;function f(t){s=s||t;var p=Math.min((t-s)/1200,1);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
function hero(){
  var nx=LIST.filter(function(e){return e.date>=T})[0],pv=LIST.filter(function(e){return e.date<T}).pop();
  var left=diff(nx.date,T);
  $("nName").textContent=left===0?nx.n+" is today":nx.n;$("nHij").textContent=hs(nx.h);$("nGreg").textContent=G(nx.date,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  $("rlbl").textContent=left===1?"day left":"days left";
  var p=pv?diff(T,pv.date)/diff(nx.date,pv.date):0,off=314*(1-p);
  var rp=$("rp");rp.style.setProperty("--off",off);requestAnimationFrame(function(){rp.style.strokeDashoffset=off});
  countUp($("rnum"),left)}

function render(dir){
  var first=D(view.y,view.m,1),n=D(view.y,view.m+1,0).getDate(),g=$("grid");
  $("mTitle").textContent=G(first,{month:"long",year:"numeric"});
  var a=hij(first),b=hij(D(view.y,view.m,n));
  $("mHij").textContent=a.m===b.m?HN[a.m-1]+" "+a.y:HN[a.m-1]+" – "+HN[b.m-1]+" "+b.y;
  var html="",i;
  for(i=0;i<first.getDay();i++)html+="<span></span>";
  for(i=1;i<=n;i++){
    var d=D(view.y,view.m,i),h=hij(d),e=EV[key(d)],c="c";
    if(d.getDay()===5)c+=" fri";if(e)c+=" ev"+(e.k==="eid"?" eid":"");
    if(+d===+T)c+=" now";if(+d===+sel)c+=" sel";
    html+='<button class="'+c+'" style="--i:'+i+'" data-t="'+(+d)+'" aria-label="'+G(d,{weekday:"long",day:"numeric",month:"long"})+", "+h.d+" "+HN[h.m-1]+(e?", "+e.n:"")+'"><span class="g">'+i+'</span><span class="h">'+(h.d===1?HN[h.m-1].split(" ")[0].slice(0,4):h.d)+"</span></button>"}
  g.className="grid";void g.offsetWidth;g.className="grid"+(dir?" go"+(dir<0?" back":""):"");
  g.innerHTML=html;detail()}
function detail(){
  var h=hij(sel),e=EV[key(sel)];
  $("detail").innerHTML="<b>"+G(sel,{weekday:"long",day:"numeric",month:"long",year:"numeric"})+'</b><span class="hj">'+hs(h)+"</span>"+(e?'<div class="tag"><i></i>'+e.n+" · "+e.t+"</div>":(sel.getDay()===5?'<div class="tag"><i></i>Jumuʿah, the Friday prayer</div>':""))}
function shift(n){view.m+=n;var d=D(view.y,view.m,1);view.y=d.getFullYear();view.m=d.getMonth();render(n)}
$("prev").onclick=function(){shift(-1)};$("next").onclick=function(){shift(1)};
$("goToday").onclick=function(){var dir=(view.y*12+view.m)-(T.getFullYear()*12+T.getMonth());view.y=T.getFullYear();view.m=T.getMonth();sel=T;render(dir>0?-1:1)};
$("grid").onclick=function(ev){var b=ev.target.closest(".c");if(!b)return;sel=new Date(+b.dataset.t);
  document.querySelectorAll(".c.sel").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");detail()};

function tabs(){
  var ys=[hy-1,hy,hy+1];
  $("tabs").innerHTML=ys.map(function(y){return '<button aria-pressed="'+(y===hy)+'" data-y="'+y+'">'+y+"</button>"}).join("")}
$("tabs").onclick=function(ev){var b=ev.target.closest("button");if(!b)return;hy=+b.dataset.y;tabs();list()};
function list(){
  var items=LIST.filter(function(e){return e.h.y===hy});
  $("list").innerHTML=items.length?items.map(function(e,i){
    var dd=diff(e.date,T),w=dd===0?"Today":dd>0?"In "+dd+(dd===1?" day":" days"):"Passed";
    return '<button class="it'+(dd<0?" past":"")+(e.k==="eid"?" eid":"")+'" style="--i:'+i+'" data-t="'+(+e.date)+'"><span class="db"><b>'+e.date.getDate()+"</b><span>"+G(e.date,{month:"short"})+'</span></span><span class="m"><b>'+e.n+"</b><span>"+e.h.d+" "+HN[e.h.m-1]+" · "+e.t+'</span></span><span class="when'+(dd>=0&&dd<=30?" soon":"")+'">'+w+"</span></button>"}).join(""):'<p class="sub">No dates for this year yet.</p>'}
$("list").onclick=function(ev){var b=ev.target.closest(".it");if(!b)return;var d=new Date(+b.dataset.t);sel=d;
  var dir=(d.getFullYear()*12+d.getMonth())-(view.y*12+view.m);view.y=d.getFullYear();view.m=d.getMonth();render(dir);
  $("calendar").scrollIntoView({behavior:"smooth",block:"start"})};
render();hero();tabs();list();
window.MominCalendarSettingsV1={setHijriAdjustment:function(value){var n=Number(value);if(n!==-1&&n!==0&&n!==1)n=0;hijriAdjustment=n;rebuildHijriEvents();hy=hij(T).y;$("todayH").textContent=hs(hij(T));hero();tabs();list();render()}};
</script>

<script>
/* MOMIN host navigation bridge — leaves the reference calendar logic and styling untouched. */
(function () {
  var nav = document.querySelector('nav[aria-label="Main"]');
  if (!nav) return;
  nav.addEventListener("click", function (event) {
    var link = event.target.closest('a[href^="#"]');
    if (!link) return;
    var destination = link.getAttribute("href").slice(1);
    if (["home", "prayers", "quran", "calendar"].indexOf(destination) < 0) return;
    event.preventDefault();
    if (destination !== "calendar") {
      window.parent.postMessage(
        { type: "momin-calendar-navigation", page: destination },
        window.location.origin
      );
    }
  });
})();
</script>
